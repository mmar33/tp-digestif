/* Mode local : remplace les services claude.ai (db, user, downloads) quand l'application
   est ouverte hors de claude.ai (fichier, Moodle, serveur web). Les données sont enregistrées
   dans le navigateur de l'appareil (localStorage) et partagées entre les pages et onglets
   du même site, mais pas entre appareils. Sur claude.ai, ce module ne fait rien. */
(function(){
  if ((window.claude && window.claude.use) || window.APP_CONFIG) return;
  var P = "cl-db:", L = "cl-lease:";
  var ls = (function(){ try{ var k="__cl_t"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return localStorage; }catch(e){ return null; } })();
  var mem = {};
  function sget(k){ if(ls){ try{ return ls.getItem(k); }catch(e){} } return Object.prototype.hasOwnProperty.call(mem,k) ? mem[k] : null; }
  function sset(k,v){ if(ls){ try{ ls.setItem(k,v); return; }catch(e){} } mem[k]=v; }
  function sdel(k){ if(ls){ try{ ls.removeItem(k); }catch(e){} } delete mem[k]; }
  function skeys(){ var out=[]; if(ls){ try{ for(var i=0;i<ls.length;i++) out.push(ls.key(i)); }catch(e){} } for(var k in mem) if(out.indexOf(k)<0) out.push(k); return out; }

  function clone(v){ return v===undefined ? undefined : JSON.parse(JSON.stringify(v)); }
  function deepFreeze(o){ if(o && typeof o==="object"){ Object.freeze(o); Object.keys(o).forEach(function(k){ deepFreeze(o[k]); }); } return o; }
  function segs(p){ return String(p).replace(/^\/+|\/+$/g,"").split("/").filter(Boolean); }
  function err(code,msg){ var e=new Error(msg||code); e.code=code; return e; }
  function readDoc(path){ var r=sget(P+path); if(!r) return null; try{ return JSON.parse(r); }catch(e){ return null; } }
  function writeDoc(path,data,v){ sset(P+path, JSON.stringify({data:data, v:v})); notify(); }
  function autoId(){ var c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789", s=""; for(var i=0;i<20;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
  function mergeDeep(a,b){ var out=clone(a)||{}; Object.keys(b).forEach(function(k){ var bv=b[k];
    if(bv && typeof bv==="object" && !Array.isArray(bv) && out[k] && typeof out[k]==="object" && !Array.isArray(out[k])) out[k]=mergeDeep(out[k],bv);
    else out[k]=clone(bv); }); return out; }
  function getField(o,f){ return String(f).split(".").reduce(function(x,k){ return x==null?undefined:x[k]; }, o); }
  function cmp(a,b){ if(a===b) return 0; if(a===undefined||a===null) return -1; if(b===undefined||b===null) return 1; return a<b?-1:a>b?1:0; }
  function test(v,op,x){
    switch(op){
      case "==": case "eq": return JSON.stringify(v)===JSON.stringify(x);
      case "!=": case "ne": return JSON.stringify(v)!==JSON.stringify(x);
      case "<": case "lt": return v!==undefined && cmp(v,x)<0;
      case "<=": case "lte": return v!==undefined && cmp(v,x)<=0;
      case ">": case "gt": return v!==undefined && cmp(v,x)>0;
      case ">=": case "gte": return v!==undefined && cmp(v,x)>=0;
      case "in": return Array.isArray(x) && x.some(function(y){ return JSON.stringify(y)===JSON.stringify(v); });
      case "not-in": return Array.isArray(x) && !x.some(function(y){ return JSON.stringify(y)===JSON.stringify(v); });
      case "array-contains": return Array.isArray(v) && v.some(function(y){ return JSON.stringify(y)===JSON.stringify(x); });
      case "array-contains-any": return Array.isArray(v) && Array.isArray(x) && v.some(function(y){ return x.some(function(z){ return JSON.stringify(y)===JSON.stringify(z); }); });
    }
    return false;
  }
  var META={fromCache:false, hasPendingWrites:false};
  function docSnap(path){ var id=segs(path).pop(), r=readDoc(path), d=r?deepFreeze(clone(r.data)):undefined;
    return {id:id, exists:!!r, data:function(){ return d; }, metadata:META, _v:r?r.v:0}; }

  /* ---- abonnements ---- */
  var subs=[];
  var pending=false;
  function notify(){ if(pending) return; pending=true; setTimeout(function(){ pending=false; subs.slice().forEach(function(s){ try{ s.check(); }catch(e){} }); },0); }
  window.addEventListener("storage", function(e){ if(!e.key || e.key.indexOf(P)===0) notify(); });

  function docRef(path){
    var sg=segs(path); if(sg.length%2!==0) throw err("invalid_argument","Chemin de document invalide : "+path);
    path=sg.join("/");
    var ref={ id:sg[sg.length-1], path:path,
      get:function(){ return Promise.resolve(docSnap(path)); },
      set:function(data){ var r=readDoc(path); writeDoc(path, clone(data)||{}, (r?r.v:0)+1); return Promise.resolve(); },
      update:function(data){ var r=readDoc(path); if(!r) return Promise.reject(err("invalid_argument","Document absent : "+path)); writeDoc(path, mergeDeep(r.data,data||{}), r.v+1); return Promise.resolve(); },
      delete:function(){ sdel(P+path); sdel(L+path); notify(); return Promise.resolve(); },
      collection:function(p){ return colRef(path+"/"+p); },
      acquire:function(o){ o=o||{}; var ttl=Math.min(600000,Math.max(1000,o.ttlMs||30000)), now=Date.now(), cur=null;
        try{ cur=JSON.parse(sget(L+path)||"null"); }catch(e){}
        if(cur && cur.exp>now && cur.holder!==o.holder) return Promise.resolve({acquired:false, expiresAt:new Date(cur.exp).toISOString()});
        var exp=now+ttl; sset(L+path, JSON.stringify({holder:o.holder, exp:exp}));
        var r=readDoc(path), v=(r?r.v:0)+1; writeDoc(path, mergeDeep(r?r.data:{}, o.data||{}), v);
        return Promise.resolve({acquired:true, version:v, expiresAt:new Date(exp).toISOString(), holder:o.holder}); },
      release:function(o){ var cur=null; try{ cur=JSON.parse(sget(L+path)||"null"); }catch(e){} if(cur && (!o||!o.holder||cur.holder===o.holder)) sdel(L+path); return Promise.resolve(); },
      onSnapshot:function(next, error){ if(typeof next==="object" && next && next.next){ error=next.error; next=next.next; }
        var last=null, alive=true;
        var s={check:function(){ if(!alive) return; var sn=docSnap(path), sig=sn.exists?sn._v+":"+JSON.stringify(sn.data()):"absent"; if(sig===last) return; last=sig; try{ next(sn); }catch(e){ if(error) error(e); } }};
        subs.push(s); setTimeout(s.check,0);
        return function(){ alive=false; subs=subs.filter(function(x){ return x!==s; }); }; }
    };
    return ref;
  }

  function colRef(path, q){
    var sg=segs(path); if(sg.length%2!==1) throw err("invalid_argument","Chemin de collection invalide : "+path);
    path=sg.join("/"); q=q||{w:[], o:[], l:0};
    function run(){
      var pre=P+path+"/", docs=[];
      skeys().forEach(function(k){ if(k.indexOf(pre)!==0) return; var rest=k.slice(pre.length); if(!rest || rest.indexOf("/")>=0) return; docs.push(docSnap(path+"/"+rest)); });
      docs=docs.filter(function(d){ return d.exists && q.w.every(function(c){ return test(getField(d.data(),c[0]),c[1],c[2]); }); });
      if(q.o.length) docs.sort(function(a,b){ for(var i=0;i<q.o.length;i++){ var c=cmp(getField(a.data(),q.o[i][0]),getField(b.data(),q.o[i][0])); if(c) return q.o[i][1]==="desc"?-c:c; } return 0; });
      else docs.sort(function(a,b){ return a.id<b.id?-1:a.id>b.id?1:0; });
      if(q.l) docs=docs.slice(0,q.l);
      return docs;
    }
    function qsnap(docs, prev){
      var changes=docs.map(function(d,i){ var old=prev?prev.findIndex(function(p){ return p.id===d.id; }):-1; return {type:old<0?"added":"modified", doc:d, oldIndex:old, newIndex:i}; });
      if(prev) prev.forEach(function(p,i){ if(!docs.some(function(d){ return d.id===p.id; })) changes.push({type:"removed", doc:p, oldIndex:i, newIndex:-1}); });
      return {docs:docs, size:docs.length, empty:!docs.length, docChanges:function(){ return changes; }, metadata:META, forEach:function(f){ docs.forEach(f); }};
    }
    var ref={ id:sg[sg.length-1], path:path,
      doc:function(id){ return docRef(path+"/"+(id||autoId())); },
      add:function(data){ var d=docRef(path+"/"+autoId()); return d.set(data).then(function(){ return d; }); },
      where:function(f,op,v){ return colRef(path,{w:q.w.concat([[f,op,v]]), o:q.o, l:q.l}); },
      orderBy:function(f,dir){ return colRef(path,{w:q.w, o:q.o.concat([[f,dir||"asc"]]), l:q.l}); },
      limit:function(n){ return colRef(path,{w:q.w, o:q.o, l:n}); },
      get:function(){ return Promise.resolve(qsnap(run(),null)); },
      onSnapshot:function(next, error){ if(typeof next==="object" && next && next.next){ error=next.error; next=next.next; }
        var lastSig=null, lastDocs=null, alive=true;
        var s={check:function(){ if(!alive) return; var docs=run(), sig=JSON.stringify(docs.map(function(d){ return [d.id,d._v,d.data()]; })); if(sig===lastSig) return;
          var sn=qsnap(docs,lastDocs); lastSig=sig; lastDocs=docs; try{ next(sn); }catch(e){ if(error) error(e); } }};
        subs.push(s); setTimeout(s.check,0);
        return function(){ alive=false; subs=subs.filter(function(x){ return x!==s; }); }; }
    };
    return ref;
  }

  var db={ doc:function(p){ return docRef(p); }, collection:function(p){ return colRef(p); } };

  /* ---- identité de l'appareil ---- */
  var uid=sget("cl-user-id"); if(!uid){ uid="local-"+autoId().slice(0,12); sset("cl-user-id",uid); }

  function teacher(){ return sget("cl-enseignant")==="1"; }
  var user={ id:function(){ return Promise.resolve(uid); },
    me:function(){ return Promise.resolve({id:uid, email:null, name:"", isMe:true, isOwner:teacher(), canEdit:teacher()}); },
    canEdit:function(){ return Promise.resolve(teacher()); },
    isOwner:function(){ return Promise.resolve(teacher()); },
    can:function(){ return Promise.resolve(teacher()); },
    profiles:function(ids){ var o={}; (ids||[]).forEach(function(i){ o[i]={id:i, name:"", email:null, isMe:i===uid}; }); return Promise.resolve(o); } };

  /* ---- téléchargements ---- */

      var d=req.data, blob = d instanceof Blob ? d : new Blob([d], {type:req.mimeType||"application/octet-stream"});

  window.claude={ local:true, use:function(name){
    if(name==="db") return Promise.resolve(db);
    if(name==="user") return Promise.resolve(user);
    if(name==="downloads") return Promise.resolve(downloads);
    return Promise.resolve(null); /* assets, artifact, sample… : indisponibles hors claude.ai */
  } };
})();

<title>Validation 3D des familles</title>

<style>
/* Layout : visualiseur 3D plein cadre, bandeau d'en-tête et panneau d'action en bas (empilé sur téléphone, latéral sur grand écran) */
:root{
  --bg:#F3F4F2; --surface:#FFFFFF; --ink:#1C2321; --muted:#5B6662; --line:#D5DAD7;
  --accent:#2D5F8E; --accent-ink:#FFFFFF; --ok:#1F7A4D; --ok-bg:#E3F3EA; --ko:#B3362B; --ko-bg:#FBE7E4;
  --stage:#E7EAE8;

  --body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1D2421; --ink:#E7ECE9; --muted:#9DA9A4; --line:#33403B;
  --accent:#6FA3D6; --accent-ink:#0E1A26; --ok:#5BC48E; --ok-bg:#16301F; --ko:#F08A7E; --ko-bg:#3A1C18;
  --stage:#0F1412; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1D2421; --ink:#E7ECE9; --muted:#9DA9A4; --line:#33403B;
  --accent:#6FA3D6; --accent-ink:#0E1A26; --ok:#5BC48E; --ok-bg:#16301F; --ko:#F08A7E; --ko-bg:#3A1C18;
  --stage:#0F1412; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
.app{height:100%;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;font-weight:600;padding:6px 12px;min-height:36px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sp,var(--accent));border-color:var(--sp,var(--accent));color:#fff}
.chip:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--bg);border-radius:10px;padding:3px}
.tab{font:inherit;font-weight:600;font-size:15px;border:0;background:transparent;color:var(--muted);padding:7px 12px;min-height:38px;border-radius:8px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px}

.stage{position:relative;background:var(--stage);min-height:0;overflow:hidden;touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;pointer-events:none}
.pin-label{position:absolute;transform:translate(-50%,-130%);background:var(--surface);color:var(--ink);border:1px solid var(--line);font-size:13px;font-weight:600;padding:2px 7px;border-radius:6px;white-space:nowrap}
.layers{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 20px)}
.layer{font:inherit;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;padding:5px 10px;min-height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;opacity:.95}
.layer[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.status{position:absolute;inset:auto 0 0 0;padding:10px 16px;font-size:14px;color:var(--muted);text-align:center}
.credit{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:8px;font-size:12px;color:var(--muted);max-width:70%;text-align:right;background:var(--surface);padding:2px 6px;border-radius:4px}
.credit a{color:inherit}
aside{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding-block:18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:820px){aside{border-left:0;border-top:1px solid var(--line);max-height:46vh}}
h2{margin:0;font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
label{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:5px}
input[type=text],select{font:inherit;font-weight:400;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:42px}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:10px;padding:11px 16px;min-height:46px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.layer:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.target{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.steps{display:flex;gap:6px}
.dot{width:28px;height:6px;border-radius:3px;background:var(--line)}
.dot.ok{background:var(--ok)} .dot.ko{background:var(--ko)} .dot.now{background:var(--accent)}
.fb{padding:10px 12px;border-radius:10px;font-weight:600}
.fb.ok{background:var(--ok-bg);color:var(--ok)} .fb.ko{background:var(--ko-bg);color:var(--ko)}
.verdict{padding:16px;border-radius:12px;display:flex;flex-direction:column;gap:6px}
.verdict.ok{background:var(--ok-bg);color:var(--ok)} .verdict.ko{background:var(--ko-bg);color:var(--ko)}
.verdict strong{font-family:var(--display);font-size:32px;line-height:1}
.verdict .meta{color:var(--ink);font-size:15px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.list li{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:15px}
.list li span{min-width:0;overflow-wrap:anywhere}
.list small{color:var(--muted);display:block;font-size:12px}
.x{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--ko);border-radius:6px;padding:4px 8px;min-height:32px;cursor:pointer}
.toggle{display:flex;flex-direction:row;align-items:center;gap:8px;font-weight:600}
@media (max-width:820px){
  h1{font-size:22px}
  .chips{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:2px}
  .chip{flex:none}
  .tabs{margin-left:0;width:100%}
  .tab{flex:1 1 0;min-width:0;padding:7px 4px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabs{max-width:100%}
  .layers{flex-wrap:nowrap;overflow-x:auto}
  .layer{flex:none}
  main{grid-template-rows:minmax(320px,1fr) auto}
  aside{max-height:42vh}
}
textarea{font:inherit;font-weight:400;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
input[type=number],input[type=password]{font:inherit;font-weight:400;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:42px}
table.notes input.mini{width:56px;min-height:34px;padding:4px 6px}
body[data-mode="quizrep"] #species,body[data-mode="quizrep"] #vues,body[data-mode="consignes"] .stage,body[data-mode="jeu"] .stage,body[data-mode="profil"] .stage,body[data-mode="consignes"] #species,body[data-mode="consignes"] #vues,body[data-mode="jeu"] #species,body[data-mode="jeu"] #vues,body[data-jeuval] #species,body[data-jeuval] #vues,body[data-jeuval] .tabs,body[data-jeuval] .joueur,body[data-mode="profil"] #species,body[data-mode="profil"] #vues,body[data-mode="quiz"] .stage,body[data-mode="notes"] .stage,body[data-mode="quiz"] #species,body[data-mode="quiz"] #vues,body[data-mode="notes"] #species,body[data-mode="notes"] #vues{display:none}
body[data-mode="consignes"] main,body[data-mode="jeu"] main,body[data-mode="profil"] main,body[data-mode="quiz"] main,body[data-mode="notes"] main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
body[data-mode="consignes"] aside,body[data-mode="jeu"] aside,body[data-mode="profil"] aside,body[data-mode="quiz"] aside,body[data-mode="notes"] aside{border:0;max-height:none;width:100%;max-width:820px;margin:0 auto}
.qtxt{font-size:19px;font-weight:600;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;font-size:16px;text-align:left;padding:12px 14px;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.juste{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}

.qsteps{flex-wrap:wrap;gap:4px}.qsteps .dot{width:14px}
.fiche{display:flex;flex-direction:column;gap:12px}

.list li b{white-space:nowrap}

     limitée par le margo plicatus ; muqueuse glandulaire (fundique rougeâtre, pylorique jaunâtre).

    {id:'caecum_corps',nom:'Corps du cæcum',layer:'caecum',pts:caePts.slice(2,6),r:u=>lerp(0.19,0.11,u),bands:4,haus:0.28,spacing:0.09,col:COL.cae,bandCol:'#EADCCB'},
    {id:'caecum_apex',nom:'Apex du cæcum',layer:'caecum',pts:caePts.slice(5),r:u=>lerp(0.11,0.06,u),bands:4,haus:0.24,spacing:0.08,col:COL.cae,bandCol:'#EADCCB'}
  ],{capStart:true,capEnd:true,capLen:0.15,density:110});

  /* ===== Gros côlon, côlon transverse, petit côlon ===== */
  const VR=0.19,pc=[[0.16,0.68,0.18]];
  // petit côlon : quelques anses dorsales dans le flanc gauche, puis long trajet caudal jusqu'au bassin
  for(let k=1;k<=16;k++){const t=k/16;pc.push([lerp(0.16,0.55,t)+0.12*Math.sin(t*Math.PI*4),0.70+0.07*Math.cos(t*Math.PI*5),0.20+0.11*Math.sin(t*Math.PI*3+0.5)]);}
  pc.push([0.72,0.66,0.16],[0.90,0.64,0.10],[1.05,0.63,0.05],[1.22,0.62,0.02]);
  const cvdPts=[[0.30,0.58,-0.22],[0.16,0.46,-0.38],[0.0,0.26,-0.40],[-0.30,0.20,-0.38],[-0.62,0.21,-0.30]];
  put([
    {id:'cvd',nom:'Côlon ventral droit',layer:'ascendant',pts:cvdPts,r:u=>u<0.18?smooth(0.08,VR,u/0.18):VR,bands:4,haus:0.28,spacing:0.10,col:COL.gc,bandCol:'#EADCCB'},
    {id:'sternale',nom:'Courbure sternale',layer:'ascendant',pts:[[-0.62,0.21,-0.30],[-0.80,0.20,-0.12],[-0.80,0.20,0.12],[-0.62,0.21,0.30]],r:()=>VR*0.97,bands:4,haus:0.28,spacing:0.10,col:COL.gc,bandCol:'#EADCCB'},
    {id:'cvg',nom:'Côlon ventral gauche',layer:'ascendant',pts:[[-0.62,0.21,0.30],[-0.25,0.20,0.36],[0.25,0.21,0.35],[0.62,0.22,0.25]],r:()=>VR,bands:4,haus:0.28,spacing:0.10,col:COL.gc,bandCol:'#EADCCB'},
    {id:'pelvienne',nom:'Courbure pelvienne',layer:'ascendant',pts:[[0.62,0.22,0.25],[0.80,0.25,0.16],[0.81,0.36,0.09],[0.66,0.45,0.12]],r:u=>u<0.45?smooth(VR,0.055,u/0.45):0.055,col:COL.gc,rugo:0.025},
    {id:'cdg',nom:'Côlon dorsal gauche',layer:'ascendant',pts:[[0.66,0.45,0.12],[0.30,0.46,0.30],[-0.20,0.47,0.32],[-0.62,0.49,0.26]],r:u=>lerp(0.065,0.09,u),bands:1,haus:0.05,spacing:0.12,col:COL.gc,bandCol:'#EADCCB',rugo:0.025},
    {id:'diaphragmatique',nom:'Courbure diaphragmatique',layer:'ascendant',pts:[[-0.62,0.49,0.26],[-0.74,0.52,0.10],[-0.74,0.55,-0.12],[-0.58,0.58,-0.28]],r:u=>smooth(0.075,0.17,u),bands:3,haus:0.14,spacing:0.12,col:COL.gc,bandCol:'#EADCCB'},
    {id:'cdd',nom:'Côlon dorsal droit',layer:'ascendant',pts:[[-0.58,0.58,-0.28],[-0.35,0.61,-0.27],[-0.05,0.63,-0.20],[0.12,0.66,-0.08]],r:u=>u<0.55?smooth(0.17,0.25,u/0.55):smooth(0.25,0.07,(u-0.55)/0.45),bands:3,haus:0.14,spacing:0.13,col:COL.gc,bandCol:'#EADCCB'},
    {id:'transverse',nom:'Côlon transverse',layer:'descendant',pts:[[0.12,0.66,-0.08],[0.10,0.71,0.05],[0.16,0.68,0.18]],r:u=>smooth(0.07,0.042,u),col:COL.pc,rugo:0.02},
    {id:'petit_colon',nom:'Petit côlon',layer:'descendant',pts:pc,r:()=>0.05,bands:2,haus:0.3,spacing:0.06,col:COL.pc,bandCol:'#D8BBA6'}
  ],{capStart:true,capEnd:true,capLen:0.06,density:115});

  /* ===== Foie : silhouette d'après une face viscérale réelle (photo fournie) et le schéma du cours :
     plus large que haut, grand lobe gauche latéral, petits lobes gauche médial et carré au bord ventral
     (encoche du ligament rond entre les deux), grand lobe droit arrondi, processus caudé en languette sur
     le bord dorsal droit, hile au centre. Appliqué contre la coupole diaphragmatique. ===== */
  // position oblique : le lobe droit s'étend loin caudalement, haut sous les côtes droites (vue droite, projection pariétale)
  const xMid=(y,z)=>-1.11+0.5*((y-0.70)*(y-0.70)+z*z)+2.2*Math.max(0,-z)*Math.max(0,y-0.45)
    -0.13*Math.exp(-((y-0.82)*(y-0.82)+(z+0.28)*(z+0.28))/(2*0.09*0.09));   // empreinte de la partie pylorique et du duodénum
  // ellipses du contour, en pixels de la photo (x, y, rayon x, rayon y), converties en (z, y) en mètres
  const pz=xi=>0.43-(xi-55)/515*0.86,py=yi=>1.04-(yi-30)/365*0.74,rz=r=>r/515*0.86,ry=r=>r/365*0.74;
  const ELL=[[170,235,120,130],[198,340,58,42],[285,332,52,46],[440,290,130,95],[330,220,150,90],[520,240,50,42],[495,172,48,26]]
    .map(([a,b,c,d])=>[pz(a),py(b),rz(c),ry(d)]);
  const CAU=ELL[6];
  const contour=(z,y)=>{let d=1e9;for(const [cz,cy,a,b] of ELL){const e=(Math.hypot((z-cz)/a,(y-cy)/b)-1)*Math.min(a,b);d=d===1e9?e:smin(d,e,0.05);}return d;};
  const ENC=[[pz(150),py(362)],[pz(238),py(348)],[pz(325),py(330)]];   // incisures 4|5, 5|6 (ligament rond), 6|7
  const relev=(y,z)=>y-0.30*Math.max(0,-z)/0.43;   // le côté droit remonte dorsalement
  const sdFoie=(x,yr,z)=>{
    const y=relev(yr,z);
    let f2=contour(z,y);
    for(const [z0,yt] of ENC){const w=0.003+0.016*Math.max(0,yt-y)/0.2;f2=smax(f2,-Math.max(Math.abs(z-z0)-w,y-yt),0.008);}
    const t=Math.min(1,Math.max(0,-f2)/0.07),sm=t*t*(3-2*t),rg=Math.min(1,Math.hypot(z/0.45,(y-0.66)/0.38));
    const h=0.010+(0.032+0.018*(1-rg*rg))*sm;
    return Math.max(Math.abs(x-xMid(yr,z))-h,f2)+0.002*bruit(x*2,yr*2,z*2);};
  const Sf=surfaceSDF(sdFoie,[-1.26,0.24,-0.52],[-0.10,1.24,0.52],108,230000);
  const lobeDe=(x,yr,z)=>{const y=relev(yr,z);
    if(Math.hypot((z-CAU[0])/CAU[2],(y-CAU[1])/CAU[3])<1.25)return 4;   // processus caudé
    if(z<ENC[2][0])return 3;                                             // lobe droit
    if(y<0.55&&z<ENC[1][0])return 2;                                     // lobe carré
    if(y<0.52&&z<ENC[0][0])return 1;                                     // lobe gauche médial
    return 0;};                                                          // lobe gauche latéral
  const cf=colorier(Sf,(x,y,z,C)=>{C.set('#6A3A33').multiplyScalar(0.86+0.14*bruit(x*1.6,y*1.6,z*1.6));return lobeDe(x,y,z);});
  add(geoDe(Sf.pos,Sf.nor,cf.col,cf.zone),'foie','lobe_droit','Foie',{zones:['lobe_gl','lobe_gm','lobe_carre','lobe_droit','proc_caude'],rough:0.4});

  /* ===== Rate : falciforme, sur la paroi gauche ===== */
  const RA=[-0.38,1.03,0.45],RB=[-0.70,0.24,0.57];
  const ru=[RB[0]-RA[0],RB[1]-RA[1],RB[2]-RA[2]],RL=_len(...ru);ru[0]/=RL;ru[1]/=RL;ru[2]/=RL;
  const re2=[0,0,1],re1=[ru[1]*1-ru[2]*0,ru[2]*0-ru[0]*1,0];{const l=_len(...re1);re1[0]/=l;re1[1]/=l;}
  const sdRate=(x,y,z)=>{const px=x-RA[0],py=y-RA[1],pz=z-RA[2];const s=(px*ru[0]+py*ru[1]+pz*ru[2])/RL,t=Math.max(0,Math.min(1,s));
    const w=lerp(0.17,0.04,Math.pow(t,0.9)),h=lerp(0.032,0.016,t),off=0.07*Math.sin(Math.PI*t);
    const qx=px-ru[0]*RL*t,qy=py-ru[1]*RL*t,qz=pz-ru[2]*RL*t;
    const a=qx*re1[0]+qy*re1[1]+qz*re1[2]-off,b=qz-0.02*Math.sin(Math.PI*t);const e=s<0?-s*RL:s>1?(s-1)*RL:0;
    const d=Math.sqrt((a/w)*(a/w)+(b/h)*(b/h));
    return (e===0?(d-1)*h:Math.sqrt(Math.pow(Math.max(d-1,0)*h,2)+e*e))+0.002*bruit(x*3,y*3,z*3);};
  const Sr=surfaceSDF(sdRate,[-0.98,0.14,0.36],[-0.14,1.16,0.66],80,120000);
  const cr=colorier(Sr,(x,y,z,C)=>{C.set('#57506A').multiplyScalar(0.86+0.14*bruit(x*2.5,y*2.5,z*2.5));return 0;});
  add(geoDe(Sr.pos,Sr.nor,cr.col),'rate','rate','Rate',{rough:0.4});

  /* ===== Pancréas : triangulaire, lobulé, percé par l'anneau pancréatique ===== */
  const T=[[-0.60,-0.33],[-0.52,0.22],[-0.77,-0.04]],AN=[-0.635,-0.07],YP=0.93;
  const sdTri=(px,pz)=>{let d=1e9,sg=1;for(let i=0;i<3;i++){const a=T[i],b=T[(i+1)%3];const ex=b[0]-a[0],ez=b[1]-a[1],wx=px-a[0],wz=pz-a[1];
      const h=Math.max(0,Math.min(1,(wx*ex+wz*ez)/(ex*ex+ez*ez)));d=Math.min(d,Math.hypot(wx-ex*h,wz-ez*h));
      const cr=ex*wz-ez*wx;if(cr<0)sg=-1;}return sg<0?d:-d;};
  // corps autour de l'anneau, lobe droit le long du duodénum, lobe gauche long et effilé vers la rate ; surface très lobulée
  const B0=[-0.66,-0.08],lobP=[[B0,T[0],0.055,0.045],[B0,[-0.56,0.08],0.05,0.042],[[-0.56,0.08],T[1],0.042,0.026],[B0,T[2],0.045,0.03]];
  const sdPanc=(x,y,z)=>{const d2=sdTri(x,z)+0.045,dy=Math.abs(y-YP)-0.016;
    let d=Math.hypot(Math.max(d2,0),Math.max(dy,0))+Math.min(Math.max(d2,dy),0)-0.012;
    for(const [a,b,ra,rb] of lobP){const ex=b[0]-a[0],ez=b[1]-a[1],h=Math.max(0,Math.min(1,((x-a[0])*ex+(z-a[1])*ez)/(ex*ex+ez*ez)));
      const r=lerp(ra,rb,h);d=smin(d,Math.hypot(x-a[0]-ex*h,(y-YP)*1.9,z-a[1]-ez*h)-r,0.03);}
    d+=0.010*bruit(x*2.4,y*2.4,z*2.4)+0.006*bruit(x*6,y*6+3,z*6);
    d=smax(d,-(Math.hypot(x-AN[0],z-AN[1])-0.036),0.008);
    return smin(d,Math.abs(Math.hypot(x-AN[0],z-AN[1])-0.045)-0.012+Math.max(0,Math.abs(y-YP)-0.03),0.01);};
  const Sp=surfaceSDF(sdPanc,[-0.86,0.84,-0.42],[-0.42,1.02,0.32],84,110000);
  const cp=colorier(Sp,(x,y,z,C)=>{C.set('#E0BE7C').multiplyScalar(0.80+0.20*bruit(x*5,y*5,z*5));return Math.hypot(x-AN[0],z-AN[1])<0.065?1:0;});
  add(geoDe(Sp.pos,Sp.nor,cp.col,cp.zone),'pancreas','pancreas','Pancréas',{zones:['pancreas','anneau'],rough:0.55});
  put([{id:'conduit_pancreatique',nom:'Conduit pancréatique',layer:'pancreas',pts:[[-0.54,YP-0.03,0.14],[-0.58,YP-0.035,0.02],[-0.62,YP-0.035,-0.02],[-0.70,YP-0.035,-0.10],[-0.69,YP-0.035,-0.22],[-0.71,YP-0.06,-0.28]],r:()=>0.011,col:'#F2EAD8',rugo:0.01}],{capStart:true,capEnd:true,capLen:0.01,density:300,rad:12});

  /* ===== Reins et ligament néphro-splénique =====
     Rein droit sous les dernières côtes, juste caudal au lobe droit du foie ; rein gauche plus caudal,
     relié à la base de la rate par le ligament néphro-splénique. */
  const sdReins=(x,y,z)=>{
    let d=smax(sdEll(x,y,z,[-0.40,1.02,-0.24],[0.09,0.045,0.085]),-(_len(x+0.40,y-1.00,z+0.15)-0.03),0.015);
    d=smin(d,smax(sdEll(x,y,z,[-0.20,1.00,0.24],[0.10,0.045,0.072]),-(_len(x+0.20,y-0.99,z-0.165)-0.03),0.015),0.001);
    return d+0.0015*bruit(x*4,y*4,z*4);};
  const Sk=surfaceSDF(sdReins,[-0.56,0.92,-0.38],[-0.04,1.09,0.38],80,60000);
  const ck=colorier(Sk,(x,y,z,C)=>{C.set('#7A3B33').multiplyScalar(0.88+0.12*bruit(x*3,y*3,z*3));return z<0?0:1;});
  add(geoDe(Sk.pos,Sk.nor,ck.col,ck.zone),'reins','rein_droit','Reins',{zones:['rein_droit','rein_gauche'],rough:0.4});
  { const A=[],B=[];for(let i=0;i<=10;i++){const x=lerp(-0.30,-0.16,i/10);A.push([x,1.00,0.31]);B.push([x,0.99,0.425]);}
    add(membrane(A,B),'mesos','lig_nephrosplenique','Ligament néphro-splénique',{membrane:true,opacity:0.5}); }

  /* ===== Mésos et plis ===== */
  // Mésentère : de sa racine (sous la région lombaire) aux anses jéjunales et à l'iléon
  const anses=[...jej.filter((_,i)=>i%2===0),...ile.slice(1)];
  const racine=anses.map((_,i)=>{const t=i/(anses.length-1);return [lerp(0.08,-0.04,t),0.99,lerp(0.02,0.10,t)];});
  add(membrane(racine,anses),'mesos','mesentere','Mésentère',{membrane:true,opacity:0.35});
  // Pli cæco-colique : de la bande latérale du corps du cæcum au côlon ventral droit
  { const A=echantillon(caePts,0.30,0.70,18),B=echantillon(cvdPts,0.10,0.55,18);
    const pr=rapprocher(A,B,i=>lerp(0.17,0.12,i/17)*0.92,i=>(i<3?0.12:0.19)*0.92);
    add(membrane(pr.map(p=>p[0]),pr.map(p=>p[1])),'mesos','pli_caeco_colique','Pli cæco-colique',{membrane:true}); }
  // Pli iléo-cæcal : de l'iléon à la bande dorsale de la base et du corps du cæcum
  { const A=echantillon(ile,0.35,1.0,14),B=echantillon(caePts,0.36,0.12,14);
    const pr=rapprocher(A,B,()=>0.035,i=>0.18);
    add(membrane(pr.map(p=>p[0]),pr.map(p=>p[1])),'mesos','pli_ileo_caecal','Pli iléo-cæcal',{membrane:true}); }
  // Mésocôlon descendant : du petit côlon à la paroi lombaire
  { const A=echantillon(pc,0,1,40);const B=A.map(p=>[p[0],0.99,lerp(p[2],0.06,0.7)]);
    add(membrane(A.map(p=>[p[0],p[1]+0.035,p[2]]),B),'mesos','mesocolon','Mésocôlon descendant',{membrane:true,opacity:0.25}); }
  return grp;
}

function genererLapin(){
  /* Tube digestif du lapin, d'après le cours et des photos de dissection (vue ventrale) — unités relatives.
     Repère : x crânio-caudal (crânial vers -x), y dorsal (+), z gauche (+) / droite (-).
     Foie crânial couvrant toute la largeur ; estomac en J à gauche, au contact de la face viscérale du foie ;
     duodénum en longue anse le long du flanc droit (pancréas diffus dans le mésoduodénum) ; jéjunum à gauche,
     en position dorsale ; cæcum énorme, ventral, enroulé sur un tour et demi, l'appendice vermiforme au centre ;
     côlon ascendant (ampoule) le long du flanc droit, double inflexion ventrale au rein droit, côlon transverse
     contre l'estomac, côlon descendant long et médian. */
  const grp=new THREE.Group();
  const add=(geo,layer,part,name,ud)=>{const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({name:layer}));m.name=name;m.userData.mat=layer;m.userData.part=part;Object.assign(m.userData,ud||{});grp.add(m);return m;};
  const put=(defs,o)=>tubeParties(defs,o).forEach((g,k)=>add(g,defs[k].layer,defs[k].id,defs[k].nom));
  const plein=(sdf,mn,mx,res,maxP,coul,layer,part,nom,zones,ud)=>{const S=surfaceSDF(sdf,mn,mx,res,maxP);
    const c=colorier(S,coul);return add(geoDe(S.pos,S.nor,c.col,zones?c.zone:undefined),layer,part,nom,Object.assign(zones?{zones}:{},ud||{}));};

  /* ===== Estomac en J ===== */
  const F=[-0.38,0.31,0.16],B=[-0.27,0.26,0.03],A=[-0.28,0.25,-0.10],P=[-0.33,0.28,-0.19],PC0=[-0.37,0.30,-0.24];
  const sdEst=(x,y,z)=>{let d=sdEll(x,y,z,F,[0.12,0.13,0.13]);
    d=smin(d,sdCap(x,y,z,F,B,0.11),0.05);d=smin(d,sdCap(x,y,z,B,A,0.08),0.05);
    d=smin(d,sdCap(x,y,z,A,P,0.045),0.04);d=smin(d,sdCap(x,y,z,P,PC0,0.03),0.02);
    return d+0.003*bruit(x*2,y*2,z*2);};
  const surf=(o,i)=>{let a=o,b=i;for(let k=0;k<40;k++){const m=[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2];if(sdEst(...m)>0)a=m;else b=m;}
    const d=[i[0]-a[0],i[1]-a[1],i[2]-a[2]],l=_len(...d);return [a[0]+d[0]/l*0.006,a[1]+d[1]/l*0.006,a[2]+d[2]/l*0.006];};
  const KC=surf([-0.47,0.42,0.06],[-0.33,0.27,0.07]),PYS=surf([-0.44,0.30,-0.27],PC0);
  plein(sdEst,[-0.54,0.10,-0.30],[-0.13,0.46,0.32],96,140000,(x,y,z,C)=>{C.set('#EBCBC2').multiplyScalar(0.88+0.12*bruit(x*2,y*2,z*2));
    if(z<-0.07)return 2;if(z>0.09)return 0;return 1;},'estomac','corps_estomac','Estomac',['fundus','corps_estomac','pylorique']);
  put([{id:'oesophage',nom:'Œsophage',layer:'estomac',pts:[[-0.80,0.43,0.02],[-0.66,0.42,0.03],[-0.54,0.41,0.05],[-0.48,0.40,0.06],KC],r:()=>0.016,col:'#BE8676',rugo:0.02}],{capStart:true,density:200});

  /* ===== Duodénum, mésoduodénum et pancréas diffus ===== */
  const duoDesc=[PYS,[-0.30,0.34,-0.26],[-0.05,0.37,-0.27],[0.20,0.35,-0.27],[0.40,0.31,-0.23],[0.46,0.30,-0.11]];
  const duoRet=[[0.46,0.30,-0.11],[0.36,0.34,-0.05],[0.29,0.31,-0.11],[0.19,0.35,-0.04],[0.10,0.32,-0.09],[0.01,0.36,-0.02],[-0.05,0.34,0.07]];
  { const Am=echantillon(duoDesc.slice(2),0,1,18),Bm=echantillon(duoRet.slice().reverse(),0,1,18);
    const pr=rapprocher(Am,Bm,()=>0.018,()=>0.018);
    add(membrane(pr.map(p=>p[0]),pr.map(p=>p[1])),'pancreas','mesoduodenum','Mésoduodénum',{membrane:true,opacity:0.32});
    const lob=[];let sd=11;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647;};
    for(let i=0;i<55;i++){const k=Math.floor(rnd()*pr.length),w=0.12+0.76*rnd(),a=pr[k][0],b=pr[k][1];
      lob.push([lerp(a[0],b[0],w),lerp(a[1],b[1],w)+(rnd()-0.5)*0.008,lerp(a[2],b[2],w),0.008+0.009*rnd()]);}
    const sdP=(x,y,z)=>{let d=1e9;for(const l of lob)d=smin(d,_len((x-l[0])/1.7,y-l[1],(z-l[2])/1.7)-l[3],0.008);return d;};
    const mn=[0,1,2].map(i=>Math.min(...lob.map(l=>l[i]))-0.05),mx=[0,1,2].map(i=>Math.max(...lob.map(l=>l[i]))+0.05);
    plein(sdP,mn,mx,80,40000,(x,y,z,C)=>{C.set('#E4C59B').multiplyScalar(0.9+0.12*bruit(x*4,y*4,z*4));return 0;},'pancreas','pancreas','Pancréas',null,{rough:0.7}); }

  /* ===== Cæcum : spirale ventrale d'un tour et demi, appendice au centre ===== */
  const cx=0.13,cz=-0.01,ax=0.38,az=0.25,th0=0.15;
  const cae=[];

function genererPorc(){
  /* Tube digestif du porc, d'après le cours et des vues de pièces isolées — unités relatives.

     rate longue en languette le long de la grande courbure ; jéjunum en festons au bord du mésentère, à droite
     et caudo-ventralement ; cæcum à 3 bandes dans le flanc gauche, apex caudo-ventral ; côlon ascendant en cône
     spiral (base dorsale, apex ventral) : tours centripètes larges, bosselés, à 2 bandes, à l'extérieur, flexure
     centrale à l'apex, tours centrifuges étroits et lisses à l'intérieur ; côlon transverse contournant la racine
     du mésentère, côlon descendant médian, rectum. */
  const grp=new THREE.Group();
  const add=(geo,layer,part,name,ud)=>{const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({name:layer}));m.name=name;m.userData.mat=layer;m.userData.part=part;Object.assign(m.userData,ud||{});grp.add(m);return m;};

  const plein=(sdf,mn,mx,res,maxP,coul,layer,part,nom,zones,ud)=>{const S=surfaceSDF(sdf,mn,mx,res,maxP);

  /* ===== Estomac et diverticule gastrique ===== */
  const F=[-0.40,0.32,0.15],B=[-0.29,0.24,0.02],A=[-0.29,0.22,-0.12],P=[-0.35,0.27,-0.20],PC0=[-0.39,0.29,-0.25],DV=[-0.47,0.47,0.11];
  const sdEst=(x,y,z)=>{let d=sdEll(x,y,z,F,[0.13,0.14,0.14]);
    d=smin(d,sdCap(x,y,z,F,B,0.12),0.05);d=smin(d,sdCap(x,y,z,B,A,0.085),0.05);
    d=smin(d,sdCap(x,y,z,A,P,0.05),0.04);d=smin(d,sdCap(x,y,z,P,PC0,0.032),0.02);
    const t=Math.max(0,Math.min(1,((x-F[0])*(DV[0]-F[0])+(y-F[1])*(DV[1]-F[1])+(z-F[2])*(DV[2]-F[2]))/0.0247));

  const surf=(o,i)=>{let a=o,b=i;for(let k=0;k<40;k++){const m=[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2];if(sdEst(...m)>0)a=m;else b=m;}
    const d=[i[0]-a[0],i[1]-a[1],i[2]-a[2]],l=_len(...d);return [a[0]+d[0]/l*0.006,a[1]+d[1]/l*0.006,a[2]+d[2]/l*0.006];};
  const KC=surf([-0.47,0.40,-0.02],[-0.34,0.29,0.04]),KCo=(()=>{const e=0.002,g=[0,1,2].map(i=>{const p=[...KC],q=[...KC];p[i]+=e;q[i]-=e;return sdEst(...p)-sdEst(...q);}),l=_len(...g);return [KC[0]+g[0]/l*0.008,KC[1]+g[1]/l*0.008,KC[2]+g[2]/l*0.008,g[0]/l,g[1]/l,g[2]/l];})(),KCn=[KC[0]+KCo[3]*0.06,KC[1]+KCo[4]*0.06,KC[2]+KCo[5]*0.06],PYS=surf([-0.44,0.30,-0.28],PC0);
  const Sest=surfaceSDF(sdEst,[-0.58,0.08,-0.30],[-0.13,0.53,0.32],110,200000);
  const zoneExt=(x,y,z)=>{if(y>0.41&&z>0.0&&x<-0.40)return 0;if(z<-0.08)return 3;if(z>0.08)return 1;return 2;};
  { const c=colorier(Sest,(x,y,z,C)=>{C.set('#D9A896').multiplyScalar(0.88+0.12*bruit(x*2,y*2,z*2));return zoneExt(x,y,z);});
    add(geoDe(Sest.pos,Sest.nor,c.col,c.zone),'estomac','corps_estomac','Estomac',{side:'front',zones:['diverticule','fundus','corps_estomac','pylorique']}); }
  // muqueuse (face interne) : pars œsophagienne blanche et kératinisée autour du cardia, vaste région des glandes cardiales
  // (pâle, gris-rosé, y compris le diverticule), région des glandes fundiques brun-rouge sur la grande courbure,
  // région pylorique jaunâtre plissée, torus pylorique saillant sur la petite courbure du pylore
  { const n=Sest.n,pos=new Float32Array(n*3),nor=new Float32Array(n*3);
    const TOR=[PYS[0]+0.02,PYS[1]-0.035,PYS[2]+0.045];
    const ss=(a,b,v)=>{const t=Math.max(0,Math.min(1,(v-a)/(b-a)));return t*t*(3-2*t);};
    // champs continus : <0 dans la région ; limites courbes et légèrement ondulées

      let off=0.010+0.0035*Math.max(0,bruit(x*5,y*5,z*5))*(1-wPO)+0.004*wPY*Math.abs(Math.sin(x*90+z*40))+0.022*Math.pow(bump(x,y,z),1.5)-0.002*wPO;
      pos[o]=x-Sest.nor[i*3]*off;pos[o+1]=y-Sest.nor[i*3+1]*off;pos[o+2]=z-Sest.nor[i*3+2]*off;
      nor[o]=-Sest.nor[i*3];nor[o+1]=-Sest.nor[i*3+1];nor[o+2]=-Sest.nor[i*3+2];}}
    const cFU=new THREE.Color('#8E4034'),cCA=new THREE.Color('#D6BCAE'),cPY=new THREE.Color('#D2B07E'),cPO=new THREE.Color('#F2EEE4'),cTO=new THREE.Color('#C49A72'),T1=new THREE.Color();
    const inn=colorier({pos,nor,n},(x,y,z,C)=>{const dK=_len(x-KC[0],y-KC[1],z-KC[2]),dP=_len(x-PYS[0],y-PYS[1],z-PYS[2]);
      if(dP<0.024){C.set('#6A332A').multiplyScalar(0.7+0.3*Math.abs(Math.sin(Math.atan2(y-PYS[1],z-PYS[2])*8)));return 6;}
      const a=fCA(x,y,z),p=fPY(x,y,z),q=fPO(x,y,z),b=bump(x,y,z);

      T1.copy(cPO).multiplyScalar(0.92+0.08*Math.abs(Math.sin(Math.atan2(y-KC[1],z-KC[2])*16)));C.lerp(T1,1-ss(-0.012,0.012,q));
      const rK=1-ss(0.012,0.026,dK);if(rK>0){T1.set('#7A4A3E').multiplyScalar(0.55+0.45*Math.abs(Math.sin(Math.atan2(y-KC[1],z-KC[2])*9))*ss(0.0,0.02,dK));C.lerp(T1,rK);}
      if(dK<0.022)return 5;if(q<0)return 0;if(b>0.35)return 4;if(p<0)return 3;if(a<0)return 1;return 2;});

  put([{id:'oesophage',nom:'Œsophage',layer:'estomac',pts:[[-0.82,0.42,0.0],[-0.66,0.41,0.0],[-0.56,0.40,0.01],KCn,KCo.slice(0,3)],r:()=>0.02,col:'#C48A7A',rugo:0.02}],{capStart:true,capEnd:true,capLen:0.012,density:200});

  /* ===== Duodénum, jéjunum en festons, iléon ===== */
  const duo=[PYS,[-0.30,0.36,-0.27],[-0.08,0.40,-0.28],[0.18,0.40,-0.26],[0.26,0.40,-0.17],[0.16,0.42,-0.09],[-0.02,0.40,-0.10]];

  const J=[0.255,0.405,0.285];

function genererVache(){

     Repère : x crânio-caudal (crânial -x), y dorsal, z gauche (+) / droite (-).

     caudo-ventral délimités par les sillons coronaires, atrium du rumen crânio-dorsal) ; réseau crânio-ventral contre
     le diaphragme ; feuillet sphérique à droite ; caillette ventrale, fundus crânial, corps sur le plancher droit, partie
     pylorique remontant ; duodénum, jéjunum en festons au bord du mésentère, iléon, cæcum, côlon ascendant (anse
     proximale, anse spirale à tours centripètes et centrifuges, anse distale), transverse, descendant, rectum ;
     foie à droite contre le diaphragme ; rate sur le sac dorsal gauche ; grand omentum à droite (translucide). */
  const grp=new THREE.Group();
  const add=(geo,layer,part,name,ud)=>{const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({name:layer}));m.name=name;m.userData.mat=layer;m.userData.part=part;Object.assign(m.userData,ud||{});grp.add(m);return m;};
  const put=(defs,o)=>tubeParties(defs,o).forEach((g,k)=>add(g,defs[k].layer,defs[k].id,defs[k].nom));
  const plein=(sdf,mn,mx,res,maxP,coul,layer,part,nom,zones,ud)=>{const S=surfaceSDF(sdf,mn,mx,res,maxP);

/* Le modèle est intégré dans la page (GLB en base64) : aucun téléchargement séparé. */
async function chargerModele(sel){
  setStatus('Préparation du modèle…');
  await new Promise(r=>setTimeout(r,30));
  const el=document.querySelector(sel);
  if(!el)throw new Error('modèle absent de la page');
  let bin;if(el.dataset.src){bin=new Uint8Array(await (await fetch(el.dataset.src)).arrayBuffer())}else{const s=atob(el.textContent.trim());bin=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++)bin[i]=s.charCodeAt(i);}
  return await new Promise((ok,ko)=>loader.parse(bin.buffer,'',ok,ko));
}

let vueSauvee=null;

/* ---------- Repères ---------- */
function rep(){return S.reperes[S.espece]||[];}
function clearPins(){while(pins.children.length)pins.remove(pins.children[0]);overlay.innerHTML='';}
function addPin(localP,color,label){
  if(!model)return;
  const g=new THREE.Mesh(new THREE.SphereGeometry(modelSize*0.008,16,12),new THREE.MeshBasicMaterial({color,depthTest:false}));
  g.renderOrder=10;g.position.copy(model.localToWorld(new THREE.Vector3(...localP)));
  g.userData.label=label||'';pins.add(g);
  if(label){const d=document.createElement('div');d.className='pin-label';d.textContent=label;overlay.append(d);g.userData.el=d;}
}
function drawPins(){
  clearPins();if(!model)return;
  if(S.mode==='prof'){rep().forEach(r=>addPin(r.p,0x2D5F8E,r.nom));if(S.brouillon)addPin(S.brouillon,0xF2A900,'Nouveau repère');}
  if(S.mode==='explorer'){if(S.showAll)rep().forEach(r=>addPin(r.p,0x2D5F8E,r.nom));if(S.explore)addPin(S.explore.p,S.explore.hit?0x1F7A4D:0x888888,S.explore.hit?S.explore.hit.nom:'');}
  if(S.mode==='valider'&&S.quiz){S.quiz.marks.forEach(m=>addPin(m.p,m.color,m.label));}
  if(S.mode==='quiz'&&S.rp){S.rp.marks.forEach(m=>addPin(m.p,m.color,m.label));}
}
function updateLabels(){
  const r=stage.getBoundingClientRect();
  pins.children.forEach(g=>{const el=g.userData.el;if(!el)return;const v=g.position.clone().project(camera);
    el.hidden=v.z>1;el.style.left=((v.x+1)/2*r.width)+'px';el.style.top=((1-v.y)/2*r.height)+'px';});
}
function nearest(localP){
  let best=null;for(const r of rep()){const d=new THREE.Vector3(...r.p).distanceTo(new THREE.Vector3(...localP));
    const lim=(TOL[r.tol]||TOL.moyenne)*modelSize;if(d<=lim&&(!best||d<best.d))best={r,d};}
  return best&&best.r;
}

/* ---------- Toucher le modèle ---------- */
const ray=new THREE.Raycaster();let down=null;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};});
canvas.addEventListener('pointerup',e=>{
  if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);const dt=performance.now()-down.t;down=null;
  if(moved>8||dt>600||!model)return;
  const r=canvas.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1),camera);
  const targets=[];model.traverse(o=>{if(o.isMesh&&o.visible)targets.push(o);});
  const hits=ray.intersectObjects(targets,false).filter(h=>!h.object.userData.fantome);if(!hits.length)return;
  const ep=S.mode==='quiz'&&!S.rp&&bin()&&bin().epreuveEnCours?itemQ(bin().epreuveEnCours.items[bin().epreuveEnCours.rep.length]||{esp:'',k:'L:'}):null;
  const qq=(S.mode==='valider'&&S.quiz&&!S.quiz.answered?S.quiz.questions[S.quiz.i]:null)||ep;
  const veutMembrane=qq&&MEMBRANES.includes(qq.layer);
  let hit=S.mode==='explorer'?hits[0]:(hits.find(h=>!h.object.userData.membrane)||hits[0]);
  if(veutMembrane)hit=hits.find(h=>h.object.userData.membrane&&h.object.userData.part===qq.layer)||hits.find(h=>h.object.userData.membrane)||hit;
  let part=hit.object.userData.part;const zs=hit.object.userData.zones;
  if(zs&&hit.face){const za=hit.object.geometry.getAttribute('zone');part=zs[Math.round(za.getX(hit.face.a))];}
  const lp=model.worldToLocal(hit.point.clone());onTap([lp.x,lp.y,lp.z],hit.object.userData.layer,part);
});

const MEMBRANES=['omentum','mesoduodenum','mesentere','pli_caeco_colique','pli_ileo_caecal','mesocolon','lig_nephrosplenique'];
function organes(){const e=sp();if(e.parties)return e.parties.map(x=>({nom:x.nom,membre:x.membre,layer:x.id,part:true}));
  const c=e.calques||{};return Object.entries(c).filter(([k,v])=>v.organe).map(([k,v])=>({nom:v.organe,membre:v.membre,layer:k}));}
function surligner(key){Object.values(meshesByLayer).forEach(ms=>ms.forEach(m=>{const on=key&&(m.userData.part===key||m.userData.layer===key||(m.userData.zones&&m.userData.zones.includes(key)));
  m.material.emissive.setHex(on?0x1F7A4D:0x000000);m.material.emissiveIntensity=on?.55:0;if(on)m.visible=true;}));}
function onTap(p,layer,part){
  if(S.mode==='prof'){S.brouillon=p;drawPins();renderPanel();return;}
  if(S.mode==='quiz'){repondreReperage(p,layer,part);return;}
  if(S.mode==='explorer'){const c=(sp().calques||{})[layer];const pt=part&&(sp().parties||[]).find(x=>x.id===part);
    evExplore(part||layer);
    S.explore={p,hit:nearest(p),organe:pt?pt.nom.replace(/^(Le |La |L’|Les )/,'').replace(/^./,m=>m.toUpperCase()):(c&&c.organe?c.nom:null)};drawPins();renderPanel();return;}
  if(S.mode==='valider'&&S.quiz&&!S.quiz.answered){
    const q=S.quiz.questions[S.quiz.i];let ok;
    if(q.part)ok=part===q.layer;else if(q.layer)ok=layer===q.layer;
    else{const lim=(TOL[q.tol]||TOL.moyenne)*modelSize;ok=new THREE.Vector3(...q.p).distanceTo(new THREE.Vector3(...p))<=lim;}
    S.quiz.answered=true;S.quiz.res.push(ok);evValidationReponse(ok);
    S.quiz.marks=[{p,color:ok?0x1F7A4D:0xB3362B,label:ok?'':'Votre réponse'}];
    if(!ok){if(q.layer)surligner(q.layer);else S.quiz.marks.push({p:q.p,color:0x1F7A4D,label:q.nom});}
    drawPins();renderPanel();
  }
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sp(){return ESPECES.find(e=>e.id===S.espece);}

function exclus(){return ((S.reperes._exclus||{})[S.espece])||[];}
function organesDemandes(){const x=exclus();return organes().filter(o=>!x.includes(o.layer));}
function startQuiz(){
  const all=[...rep(),...organesDemandes()];if(!all.length){if(S.jeuValidation)finValidationJeu(true);return;}
  const shuffled=[...all].sort(()=>Math.random()-.5);
  const first=shuffled[0];const second=shuffled.find(r=>r!==first&&r.membre!==first.membre)||shuffled[1]||first;
  S.quiz={questions:[first,second],i:0,res:[],answered:false,marks:[],start:new Date()};
  drawPins();renderPanel();
}

    <p class="muted">Cochez les structures à demander, ou touchez le modèle pour ajouter un point précis. Enregistrez quand vous avez fini, pour chaque espèce. Vues utilisées : chien Segments, chat Système digestif, cheval, vache Appareil digestif ou Rumen (scan), porc Tube digestif, lapin, Vaisseaux et péritoine.</p>
    ${b?`<label for="r-nom">Nom de la structure<input type="text" id="r-nom" autocomplete="off" placeholder="Ex. Pylore"></label>
      <label for="r-membre">Carte du jeu<select id="r-membre">${MEMBRES.map(m=>`<option>${esc(m)}</option>`).join('')}</select></label>
      <label for="r-tol">Zone acceptée<select id="r-tol"><option value="petite">Petite (structure fine)</option><option value="moyenne" selected>Moyenne</option><option value="grande">Grande (organe entier)</option></select></label>
      <div class="row"><button class="btn" id="r-add">Ajouter le repère</button><button class="btn secondary" id="r-cancel">Annuler</button></div>`
      :`<p class="fb" style="background:var(--bg)">Touchez le modèle pour placer un nouveau repère.</p>`}
    ${organes().length?`<details class="bloc" open><summary>Structures du modèle demandées en validation (${organes().length-exclus().filter(k=>organes().some(o=>o.layer===k)).length} sur ${organes().length})</summary>
      <div class="row"><button class="x neutre" id="ex-tout">Tout cocher</button><button class="x neutre" id="ex-rien">Tout décocher</button></div>
      <div class="cochage">${[...new Set(organes().map(o=>o.membre))].map(m=>`<fieldset><legend>${esc(m)}</legend>${organes().filter(o=>o.membre===m).map(o=>`<label class="toggle"><input type="checkbox" data-ex="${esc(o.layer)}" ${exclus().includes(o.layer)?'':'checked'}> ${esc(o.nom)}</label>`).join('')}</fieldset>`).join('')}</div>
      <p class="muted">Seules les structures cochées seront demandées aux étudiants. En S’entraîner, toutes restent identifiables.</p></details>`:''}
    <p class="eyebrow">Points ajoutés à la main</p>
    <ul class="list">${rep().map((r,i)=>`<li><span>${esc(r.nom)}<small>${esc(r.membre)} · zone ${esc(r.tol)}</small></span><button class="x" data-del="${i}">Supprimer</button></li>`).join('')||'<li class="muted">Aucun repère pour l’instant.</li>'}</ul>
    <button class="btn" id="save" ${S.dirty?'':'disabled'}>Enregistrer les repères</button>
    ${S.saveMsg?`<p class="muted">${esc(S.saveMsg)}</p>`:''}`;
  }
  if(S.mode==='quiz')h=renderQuiz();
  if(S.mode==='consignes')h=renderConsignes();
  if(S.mode==='attente')h=`<div class="eyebrow">Validation sur modèle 3D</div><h2>Retour au jeu…</h2><p class="muted">Le résultat a été envoyé au jeu des 7 familles.</p>`;
  if(S.mode==='profil')h=renderProfil();
  if(S.mode==='jeu')h=renderJeu();
  if(S.mode==='notes')h=renderNotes();
  panel.innerHTML=h;bindPanel();bindEval();
}

function bindPanel(){
  const $=id=>document.getElementById(id);
  $('go')?.addEventListener('click',startQuiz);
  $('next')?.addEventListener('click',()=>{surligner(null);S.quiz.i++;S.quiz.answered=false;S.quiz.marks=[];if(S.quiz.i>=2&&!S.jeuValidation)evValidationFin(S.quiz);drawPins();renderPanel();});
  panel.querySelectorAll('.gains [data-carte]').forEach(x=>x.addEventListener('click',()=>ouvrirCarte(Number(x.dataset.carte))));
  $('retour-jeu')?.addEventListener('click',()=>{const ok=S.quiz&&S.quiz.res.every(Boolean);if(S.jeuValidation&&S.jeuValidation.portail&&S.quiz)evValidationFin(S.quiz);surligner(null);S.quiz=null;drawPins();finValidationJeu(ok);});
  $('again')?.addEventListener('click',()=>{surligner(null);S.quiz=null;drawPins();renderPanel();});
  $('showall')?.addEventListener('change',ev=>{S.showAll=ev.target.checked;drawPins();});
  $('r-cancel')?.addEventListener('click',()=>{S.brouillon=null;drawPins();renderPanel();});
  $('r-add')?.addEventListener('click',()=>{
    const nom=$('r-nom').value.trim();if(!nom){$('r-nom').focus();return;}
    const p=S.brouillon.map(v=>Math.round(v*1e5)/1e5);
    (S.reperes[S.espece]=S.reperes[S.espece]||[]).push({nom,membre:$('r-membre').value,tol:$('r-tol').value,p});
    S.brouillon=null;S.dirty=true;S.saveMsg='Modifications non enregistrées.';stash();drawPins();renderPanel();});
  panel.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    rep().splice(Number(b.dataset.del),1);S.dirty=true;S.saveMsg='Modifications non enregistrées.';stash();drawPins();renderPanel();}));
  $('save')?.addEventListener('click',save);
  const majEx=f=>{S.reperes._exclus=S.reperes._exclus||{};f(S.reperes._exclus);S.dirty=true;S.saveMsg='Modifications non enregistrées.';stash();renderPanel();};
  panel.querySelectorAll('[data-ex]').forEach(c=>c.addEventListener('change',()=>majEx(X=>{const l=new Set(X[S.espece]||[]);c.checked?l.delete(c.dataset.ex):l.add(c.dataset.ex);X[S.espece]=[...l];})));
  $('ex-tout')?.addEventListener('click',()=>majEx(X=>{X[S.espece]=[];}));
  $('ex-rien')?.addEventListener('click',()=>majEx(X=>{X[S.espece]=organes().map(o=>o.layer);}));
}

function stash(){try{sessionStorage.setItem('reperes-brouillon',JSON.stringify(S.reperes));}catch(e){}}
async function save(){
  const btn=document.getElementById('save');btn.disabled=true;S.saveMsg='Enregistrement…';
  try{
    if(!S.artifact)throw {code:'not_granted'};
    await S.artifact.publish({'data/reperes.json':{content:JSON.stringify(S.reperes,null,1),contentType:'application/json'}});
    S.dirty=false;S.saveMsg='Repères enregistrés.';
    try{sessionStorage.removeItem('reperes-brouillon');}catch(e){}
  }catch(err){
    const c=err&&err.code;
    S.saveMsg=c==='conflict'?'La page a été modifiée ailleurs entre-temps. Elle va se recharger : refaites vos derniers ajouts.'
      :c==='capability_disabled'?'L’enregistrement n’est pas possible pendant que la page est partagée publiquement. Repassez-la en privé, enregistrez, puis partagez-la à nouveau.'
      :(c==='not_writer'||c==='not_granted')?'Ce compte ne peut pas modifier la page : seuls ses éditeurs peuvent enregistrer des repères.'
      :'L’enregistrement a échoué. Réessayez dans un instant.';
  }
  renderPanel();
}

   Les résultats de chaque binôme sont gardés sur l'appareil (les étudiants n'ont pas de compte) ;
   la fiche affiche un code de résultat que l'enseignante peut importer dans son carnet de notes. */
const CLE_EVAL='tp-digestif-eval-v1',CLE_CARNET='tp-digestif-carnet-v1';
/* Mode « à la maison » (paquet Moodle d'entraînement) : partie solo contre l'ordinateur, rien n'est noté, chronomètre facultatif */
const MAISON=window.__MAISON__===true||/[?&]maison=1/.test(location.search);
/* Lancement depuis le portail des ateliers : ?duos=[{id,nom}]&duo=<id>&eval=<min> ; ?embed=1 = validation 3D des familles dans le jeu du portail */
const PORTAIL=(()=>{try{const q=new URLSearchParams(location.search);let duos=null;try{duos=JSON.parse(q.get('duos')||'null');}catch(e){}
  const embed=q.get('embed')==='1';if(!Array.isArray(duos)&&!embed)return null;
  return {duos:Array.isArray(duos)?duos.filter(d=>d&&d.id).map(d=>({id:String(d.id),nom:String(d.nom||d.id)})):[],duo:q.get('duo')||'',embed,eval:Math.max(0,+q.get('eval')||0)};}catch(e){return null;}})();
const NOTES_DEF={poids:{reperage:10,quiz:10},nbReperage:6,nbQuestions:12,dureeJeu:15,dureeEval:12,montrerNote:true};
const E={binomes:{},courant:'',nouveau:false};
/* Moodle (SCORM 1.2) : si la page est ouverte comme activité SCORM, l'étudiant est identifié par son compte
   et sa note sur 20 est envoyée automatiquement au carnet de notes ; l'état est gardé dans cmi.suspend_data. */
const LMS=(()=>{const chercher=w=>{let n=0;while(w&&n<12){try{if(w.API&&w.API.LMSInitialize)return w.API;}catch(e){}if(w===w.parent)break;w=w.parent;n++;}return null;};
  let a=chercher(window);if(!a){try{a=window.opener?chercher(window.opener):null;}catch(e){}}
  if(a){try{if(String(a.LMSInitialize(''))!=='true'&&String(a.LMSGetLastError())!=='101')return null;}catch(e){return null;}}return a;})();
let lmsFini=false;
function lmsGet(k){try{return String(LMS.LMSGetValue(k)||'');}catch(e){return '';}}
function lmsSet(k,v){try{LMS.LMSSetValue(k,String(v));}catch(e){}}
function lmsNom(){const n=lmsGet('cmi.core.student_name');const m=n.split(',');return (m.length===2?(m[1].trim()+' '+m[0].trim()):n).trim()||'Étudiant';}
function lmsCharger(){const b={id:'moi',nom:lmsNom(),validations:[],quiz:null,famillesManuelles:0};
  try{const d=JSON.parse(lmsGet('cmi.suspend_data')||'{}');
    (d.v||[]).forEach(([g,e,r])=>b.validations.push({grp:g,esp:e,nom:(ESPECES.find(x=>x.id===e)||{}).nom||e,res:String(r).split('').map(c=>c==='1'),t:0}));
    if(d.q)b.quiz={score:d.q[0],total:d.q[1],t:0};
    if(d.z)b.quizEnCours={ids:d.z.i,rep:d.z.r.map(Boolean)};
    if(d.r)b.reperage={score:d.r[0],total:d.r[1],t:0};
    if(d.e)b.epreuveEnCours={items:d.e.i.map(([esp,k])=>({esp,k})),rep:d.e.r.map(Boolean)};
    if(d.t0)b.evalDebut=d.t0;if(d.ef)b.evalFini=true;
    if(d.g)Object.assign(b,{avatar:d.g.a,avatarChoisi:!!d.g.a,xp:d.g.x||0,badges:d.g.b||[],familles:d.g.f||[],echecs:d.g.c||[],explores:d.g.e||[],speleo:!!d.g.s,tentatives:d.g.t||0,perseverant:!!d.g.p,serieMax:d.g.m||0});}catch(e){}
  E.binomes={moi:b};E.courant='moi';}
function lmsSauver(){if(!LMS||lmsFini)return;const b=E.binomes.moi;if(!b)return;
  const d={q:b.quiz?[b.quiz.score,b.quiz.total]:0,z:b.quizEnCours?{i:b.quizEnCours.ids,r:b.quizEnCours.rep.map(Number)}:0,r:b.reperage?[b.reperage.score,b.reperage.total]:0,t0:b.evalDebut||0,ef:b.evalFini?1:0,g:{a:b.avatar||'',x:b.xp||0,b:b.badges||[],f:b.familles||[],c:b.echecs||[],e:(b.explores||[]).slice(-25),s:b.speleo?1:0,t:b.tentatives||0,p:b.perseverant?1:0,m:b.serieMax||0},e:b.epreuveEnCours?{i:b.epreuveEnCours.items.map(it=>[it.esp,it.k]),r:b.epreuveEnCours.rep.map(Number)}:0};
  lmsSet('cmi.suspend_data',JSON.stringify(d));
  if(MAISON){lmsSet('cmi.core.lesson_status','completed');}
  else{const s=stats(b);lmsSet('cmi.core.score.min',0);lmsSet('cmi.core.score.max',20);lmsSet('cmi.core.score.raw',Math.max(0,Math.min(20,Math.round(s.note/(s.max||20)*200)/10)));
  lmsSet('cmi.core.lesson_status',b.quiz&&b.reperage?'completed':'incomplete');}lmsSet('cmi.core.exit','suspend');
  try{LMS.LMSCommit('');}catch(e){}}
if(LMS){const fin=()=>{if(lmsFini)return;lmsSauver();lmsFini=true;try{LMS.LMSFinish('');}catch(e){}};addEventListener('pagehide',fin);addEventListener('beforeunload',fin);}
const N={acces:false,pinErr:'',msg:'',carnet:{},db:null,importMsg:''};
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}};
function cfg(){const c=(S.reperes&&S.reperes._notes)||{};const p={...NOTES_DEF.poids,...(c.poids||{})};delete p.jeu;const r={...NOTES_DEF,...c,poids:p};if(PORTAIL&&PORTAIL.eval)r.dureeEval=PORTAIL.eval;return r;}
function chargerEval(){if(LMS){lmsCharger();return;}const d=lsGet(CLE_EVAL);if(d&&d.binomes){E.binomes=d.binomes;E.courant=d.courant||'';}
  if(PORTAIL){const ids=PORTAIL.duos.map(x=>x.id);if(PORTAIL.duo&&!ids.includes(PORTAIL.duo)){PORTAIL.duos.push({id:PORTAIL.duo,nom:'Votre duo'});ids.push(PORTAIL.duo);}
    PORTAIL.duos.forEach(x=>{const b=E.binomes[x.id];if(b){if(x.nom&&x.nom!=='Votre duo')b.nom=x.nom;}else E.binomes[x.id]={id:x.id,nom:x.nom,cree:Date.now(),validations:[],quiz:null,famillesManuelles:0,xp:0,avatar:AVATARS[Math.floor(Math.random()*AVATARS.length)]};});
    E.courant=PORTAIL.duo||(ids.includes(E.courant)?E.courant:'');E.nouveau=false;sauverEval();}
  const c=lsGet(CLE_CARNET);if(c&&typeof c==='object')N.carnet=c;}
function sauverEval(){if(LMS){lmsSauver();return;}lsSet(CLE_EVAL,{binomes:E.binomes,courant:E.courant});}
const bin=()=>E.binomes[E.courant]||null;

/* Calcul des scores d'un binôme (objet local ou ligne importée) */
function stats(b){
  const r=b.reperage||null,q=b.quiz||null,P=cfg().poids;
  const sRep=r&&r.total?r.score/r.total*P.reperage:0, sQuiz=q&&q.total?q.score/q.total*P.quiz:0;
  return {reperage:r,quiz:q,sRep,sQuiz,note:Math.round((sRep+sQuiz)*10)/10,max:P.reperage+P.quiz};
}
const f1=v=>(Math.round(v*10)/10).toLocaleString('fr-FR');

/* Code de résultat : données compactes + somme de contrôle (détecte une modification à la main) */
function somme(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return (h%46656).toString(36).toUpperCase().padStart(3,'0');}
function codeResultat(b){const s=stats(b);
  const p=[b.id,s.familles-(Number(b.famillesManuelles)||0),s.bonnes,s.total,s.quiz?s.quiz.score:0,s.quiz?s.quiz.total:0,b.nom].join('|');
  const j=btoa(unescape(encodeURIComponent(p))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return 'TPD-'+j+'-'+somme(j);}
function lireCode(code){const m=String(code).trim().match(/^TPD-([A-Za-z0-9_-]+)-([0-9A-Z]{3})$/);if(!m)return null;
  if(somme(m[1])!==m[2])return {err:'somme'};
  try{const a=decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))).split('|');if(a.length<7)return null;
    const n=a.slice(1,6).map(Number);if(n.some(v=>!Number.isFinite(v)||v<0))return null;
    return {v:1,i:a[0],f:n[0],b:n[1],t:n[2],q:n[3],qt:n[4],n:a.slice(6).join('|')};}catch(e){return null;}}

/* Enregistrement d'une validation de famille */
function enregistrerValidation(q){const b=bin();if(!b||q.saved)return;q.saved=true;const e=sp();
  b.validations=b.validations||[];b.validations.push({esp:e.id,grp:grp(e),nom:e.nom,res:q.res.map(Boolean),t:Date.now()});sauverEval();}

/* Sélecteur de binôme (Valider, Quiz) */
function binomeUI(){
  if(LMS)return `<p class="moi">Connecté(e) : <b>${esc(bin()?bin().nom:'')}</b></p>`;

}
function bindBinome(){const $=id=>document.getElementById(id);
  $('bin-sel')?.addEventListener('change',ev=>{const v=ev.target.value;if(v==='__new'){E.nouveau=true;}else{E.courant=v;S.binome=v?E.binomes[v].nom:'';sauverEval();}S.qz=null;renderPanel();});

    const id=ex?ex.id:'b'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36);
    if(!ex)E.binomes[id]={id,nom,cree:Date.now(),validations:[],quiz:null,famillesManuelles:0,xp:0,avatar:AVATARS[Math.floor(Math.random()*AVATARS.length)]};

  $('bin-nom')?.addEventListener('keydown',ev=>{if(ev.key==='Enter')add();});
}

/* ---------- Épreuve de repérage (identique pour tous, indépendante du jeu) ---------- */
function candidats(id){const e=ESPECES.find(x=>x.id===id);if(!e)return [];const ex=((S.reperes._exclus||{})[id])||[];
  const org=e.parties?e.parties.map(x=>({k:'L:'+x.id,layer:x.id})):Object.entries(e.calques||{}).filter(([k,v])=>v.organe).map(([k])=>({k:'L:'+k,layer:k}));
  return [...org.filter(o=>!ex.includes(o.layer)),...(S.reperes[id]||[]).map((_,i)=>({k:'P:'+i}))];}
/* détail des réponses, transmis à l'espace encadrant du portail (synthèse) */
function detQuiz(z){return z.ids.map((id,i)=>{const Q=BANQUE[id]||{};return {th:Q.th||'',q:Q.q||'',ok:z.rep[i]?1:0,r:Q.t==='vf'?(Q.a?'Vrai':'Faux'):((Q.o||[])[Q.a]||'')};});}
function detRep(z){return z.items.map((it,i)=>{const q=itemQ(it)||{},e=ESPECES.find(x=>x.id===it.esp)||{};return {esp:e.nom||it.esp,n:q.nom||'',ok:z.rep[i]?1:0};});}
function itemQ(it){const e=ESPECES.find(x=>x.id===it.esp);if(!e)return null;
  if(it.k.startsWith('P:')){const r=(S.reperes[it.esp]||[])[Number(it.k.slice(2))];return r?{...r}:null;}
  const id=it.k.slice(2);if(e.parties){const p=e.parties.find(x=>x.id===id);return p?{nom:p.nom,membre:p.membre,layer:id,part:true}:null;}
  const c=(e.calques||{})[id];return c?{nom:c.organe,membre:c.membre,layer:id}:null;}
function tirerReperage(n){const par={};VALIDATION.forEach(id=>{const c=candidats(id).sort(()=>Math.random()-.5);if(c.length)par[id]=c;});
  const out=[];let tour=0;while(out.length<n&&Object.values(par).some(c=>c.length)){const ids=Object.keys(par).sort(()=>Math.random()-.5);
    for(const id of ids){if(out.length>=n)break;const c=par[id];if(c.length)out.push({esp:id,k:c.pop().k});}if(++tour>50)break;}
  return out;}
function allerA(id){if(S.espece!==id){S.espece=id;renderSpecies();loadEspece(id);}}
function repondreReperage(p,layer,part){const b=bin(),z=b&&b.epreuveEnCours;if(!z||S.rp)return;const it=z.items[z.rep.length];
  if(!it||S.espece!==it.esp||!model)return;const q=itemQ(it);if(!q)return;let ok;
  if(q.part)ok=part===q.layer;else if(q.layer)ok=layer===q.layer;else{const lim=(TOL[q.tol]||TOL.moyenne)*modelSize;ok=new THREE.Vector3(...q.p).distanceTo(new THREE.Vector3(...p))<=lim;}
  z.rep.push(ok);evReperage(ok);S.rp={ok,marks:[{p,color:ok?0x1F7A4D:0xB3362B,label:ok?'':'Votre réponse'}]};
  if(!ok){if(q.layer)surligner(q.layer);else S.rp.marks.push({p:q.p,color:0x1F7A4D,label:q.nom});}
  sauverEval();drawPins();renderPanel();}

  const Q=z.qs[k],opts=Q.t==='vf'?['Vrai','Faux']:Q.o,bonne=Q.t==='vf'?(Q.a?0:1):Q.a,rep=z.choix;

    <div class="opts">${opts.map((o,i)=>{let cl='opt';if(rep!=null){if(i===bonne)cl+=' juste';else if(i===rep)cl+=' faux';}return `<button class="${cl}" data-eopt="${i}" ${rep!=null?'disabled':''}>${esc(o)}</button>`;}).join('')}</div>`;
  if(rep!=null)h+=`<p class="fb ${rep===bonne?'ok':'ko'}">${rep===bonne?'Bonne réponse.':'Mauvaise réponse.'} <span style="font-weight:400">${esc(Q.x)}</span></p><button class="btn" id="en-next">${k+1<z.qs.length?'Question suivante':'Voir mon score'}</button>`;
  return h+`<p><button class="lien" id="en-fin">Arrêter l’entraînement</button></p>`;}
function tirerQuestions(n){const idx=BANQUE.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  // équilibrage : au plus ceil(n/4) questions d'un même thème
  const lim=Math.ceil(n/4),cpt={},out=[];
  for(const i of idx){const th=BANQUE[i].th;if((cpt[th]||0)>=lim)continue;cpt[th]=(cpt[th]||0)+1;out.push(i);if(out.length>=n)break;}
  for(const i of idx){if(out.length>=n)break;if(!out.includes(i))out.push(i);}
  return out;}

    ${N.msg?`<p class="muted">${esc(N.msg)}</p>`:''}

`;

function csvNotes(sep){const c=cfg(),L=lignesNotes();
  const head=['Binôme','Repérage (bonnes)','Repérage (structures)','Quiz','Questions quiz',`Repérage /${c.poids.reperage}`,`Quiz /${c.poids.quiz}`,'Note /20'];
  const q=v=>{const s=String(v);return /[;,"\n\t]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const num=v=>sep===';'?f1(v):String(Math.round(v*10)/10);
  return [head.join(sep),...L.map(r=>{const s=stats(r.obj);return [r.nom,s.reperage?s.reperage.score:'',s.reperage?s.reperage.total:'',s.quiz?s.quiz.score:'',s.quiz?s.quiz.total:'',num(s.sRep),num(s.sQuiz),num(s.note)].map(q).join(sep);})].join('\r\n');}
async function sauverCarnet(r){lsSet(CLE_CARNET,N.carnet);if(N.db&&r){try{await N.db.collection('carnet').doc(r.i.replace(/[^A-Za-z0-9_-]/g,'_')).set(r);}catch(e){}}}

function bindNotes(){const $=id=>document.getElementById(id);
  $('p-save')?.addEventListener('click',async()=>{const n=id=>Math.max(0,Number($(id).value)||0);

  panel.querySelectorAll('[data-rq]').forEach(el=>el.addEventListener('click',()=>{const b=E.binomes[el.dataset.rq];if(!b)return;
    if(el.dataset.ok!=='1'){el.dataset.ok='1';el.textContent='Confirmer ?';return;}b.quiz=null;delete b.quizEnCours;b.reperage=null;delete b.epreuveEnCours;delete b.evalDebut;delete b.evalFini;sauverEval();renderPanel();}));

    if(N.carnet[id]){delete N.carnet[id];lsSet(CLE_CARNET,N.carnet);if(N.db){try{await N.db.collection('carnet').doc(id.replace(/[^A-Za-z0-9_-]/g,'_')).delete();}catch(e){}}}
    renderPanel();}));
  $('n-import')?.addEventListener('click',async()=>{const lines=$('n-codes').value.split(/\s+/).filter(Boolean);let ok=0,ko=0;
    for(const l of lines){const o=lireCode(l);if(!o||o.err){ko++;continue;}const prev=N.carnet[o.i];o.famillesManuelles=prev?prev.famillesManuelles||0:0;N.carnet[o.i]=o;ok++;await sauverCarnet(o);}

  $('n-csv')?.addEventListener('click',async()=>{const data=new Blob(['﻿'+csvNotes(';')],{type:'text/csv'});const name=`notes-tp-digestif-${new Date().toISOString().slice(0,10)}.csv`;

/* ---------- Jeu des 7 familles numérique (une tablette par table, on se la passe) ----------
   Demande = famille + membre + critère choisi parmi 3 propositions (correction automatique).
   Famille complète = validation immédiate sur le modèle 3D (2 structures). Non noté. */
const CLE_PARTIE='tp-partie-v1';
const VUE_FAMILLE={chien:'chien_seg',chat:'chat',cheval:'cheval',vache:'vache',porc:'porc',lapin:'lapin',vaisseaux:'vaisseaux'};
const TITRE_FAMILLE={chien:'Fin limier',chat:'Œil de chat',cheval:'Seigneur du cæcum',vache:'Maître du rumen',porc:'Roi du côlon spiral',lapin:'As du sacculus',vaisseaux:'Gardien de la veine porte'};
let P=null;
function chargerPartie(){try{P=JSON.parse(localStorage.getItem(CLE_PARTIE)||'null');}catch(e){P=null;}}
function sauverPartie(){try{localStorage.setItem(CLE_PARTIE,JSON.stringify(P));}catch(e){}}
const melanger=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
function resteJeu(){if(P&&!P.duree)return Infinity;return P?Math.max(0,P.duree*60-(Date.now()-P.debut)/1000):0;}
function eq(){return P.equipes[P.tour];}
function membresFamille(f){return CARTES.map((c,i)=>c.f===f?i:-1).filter(i=>i>=0);}
function nouvellePartie(noms,opt){opt=opt||{};const avs=melanger([...AVATARS]);
  P={equipes:noms.map((n,i)=>({nom:n,av:(opt.avatar&&i===0)?opt.avatar:avs[i],main:[],familles:[],bot:!!(opt.bots&&i>0)})),pioche:melanger(CARTES.map((_,i)=>i)),tour:0,debut:Date.now(),duree:opt.duree===undefined?cfg().dureeJeu:opt.duree,phase:'passage',msg:null,dem:null,journal:[],solo:!!opt.bots};
  for(let k=0;k<6;k++)P.equipes.forEach(e=>{if(P.pioche.length)e.main.push(P.pioche.pop());});
  sauverPartie();}
function journal(t){P.journal.unshift(t);P.journal=P.journal.slice(0,6);}
function famillesEnMain(e){return [...new Set(e.main.map(i=>CARTES[i].f))].filter(f=>!P.equipes.some(x=>x.familles.includes(f)));}
function complete(e,f){return membresFamille(f).every(i=>e.main.includes(i));}
function suivant(){
  if(finPossible())return finir();
  let n=0;do{P.tour=(P.tour+1)%P.equipes.length;n++;}while(n<=P.equipes.length&&!eq().main.length&&!P.pioche.length);

/* Adversaires ordinateur (mode maison) : ils jouent tout seuls jusqu'au tour du joueur */
function jouerOrdinateurs(){let garde=0;P.recap=[];
  while(P.phase==='passage'&&eq().bot&&garde++<20){tourOrdinateur();if(finPossible()){finir();break;}
    let n=0;do{P.tour=(P.tour+1)%P.equipes.length;n++;}while(n<=P.equipes.length&&!eq().main.length&&!P.pioche.length);}
  if(P.phase==='passage'&&!eq().bot){debutTour();if(P.recap.length)P.msg={type:'info',txt:'Pendant ce temps : '+P.recap.join(' · ')};}
  sauverPartie();}
function tourOrdinateur(){const e=eq(),moi=P.equipes[0];let actions=0;
  if(!e.main.length&&P.pioche.length)e.main.push(P.pioche.pop());
  while(actions++<6){
    const f0=famillesEnMain(e).find(f=>complete(e,f));
    if(f0){const ids=membresFamille(f0);e.main=e.main.filter(i=>!ids.includes(i));
      if(Math.random()<0.8){e.familles.push(f0);journal(`${e.av} ${e.nom} pose la famille ${FAMILLES[f0].nom}`);P.recap.push(`${e.nom} pose la famille ${FAMILLES[f0].nom}`);}
      else{P.pioche=melanger(P.pioche.concat(ids));journal(`${e.av} ${e.nom} rate la validation ${FAMILLES[f0].nom}`);}
      if(finPossible())return;continue;}
    const fs=famillesEnMain(e);if(!fs.length)return;
    const f=fs.sort((a,b)=>e.main.filter(i=>CARTES[i].f===b).length-e.main.filter(i=>CARTES[i].f===a).length)[0];
    const manque=membresFamille(f).filter(i=>!e.main.includes(i));if(!manque.length)return;

function criteres(ci){const c=CARTES[ci],vrais=new Set(c.li.map(norm));
  const bonne=c.li[Math.floor(Math.random()*c.li.length)];

  if(pool.length<4)pool=CARTES.filter(x=>x.f===c.f&&x!==c).flatMap(x=>x.li).concat(pool);
