    <ul>
      <li>Une tablette par table, 2 à 5 binômes. Onglet <b>Jeu</b> : entrez les noms, l’application distribue 6 cartes à chacun et lance le minuteur.</li>
      <li>À son tour, le binôme prend la tablette (les autres ne regardent pas), choisit une famille qu’il a en main, la carte qui lui manque et le binôme à qui il la demande.</li>
      <li>Il choisit ensuite le bon <b>critère de reconnaissance</b> de cette carte parmi 3 propositions. Critère faux : il passe son tour.</li>
      <li>Le binôme a la carte : elle est donnée, on lit son « Le saviez-vous ? » à voix haute et on rejoue. Sinon : « Pioche ! ». Si la carte piochée est la bonne, on rejoue ; sinon, on passe la tablette.</li>
      <li><b>Famille complète :</b> validation immédiate sur le modèle 3D (2 structures à toucher). Réussie : la famille est posée et le binôme gagne un titre (« Maître du rumen », « Seigneur du cæcum »…). Ratée : les 6 cartes retournent dans la pioche.</li>
      <li>Fin : 7 familles posées ou fin du minuteur. Le binôme qui a posé le plus de familles gagne. <b>Le jeu ne compte pas dans la note.</b></li>
    </ul>
    <button class="lien" data-aller="jeu">Aller au jeu</button>
  </section>`}
  <section><h3><span class="n">★</span>Votre profil et vos statistiques</h3>
    <ul>
      <li>Touchez <b>votre avatar en haut de l’écran</b> pour ouvrir votre profil : choix de l’avatar, niveau et points d’expérience, badges gagnés et à débloquer, album des cartes collectionnées et résultats de l’évaluation.</li>
      <li>${LMS?'Votre profil est lié à votre compte Moodle.':PORTAIL?'Votre profil est celui de votre duo : il garde les familles validées pendant le jeu.':'Sur un appareil partagé, choisissez d’abord votre binôme (bouton « Choisir mon équipe »).'} L’expérience se gagne en identifiant des structures, en validant des familles et pendant l’évaluation.</li>
      <li>Niveaux : Externe, Stagiaire, Interne, Anatomiste, Maître anatomiste, Légende de l’anatomie. Les badges et l’expérience ne comptent pas dans la note.</li>
    </ul>
    <button class="lien" data-aller="profil">Ouvrir mon profil</button>
  </section>
  <section><h3><span class="n">${PORTAIL?1:2}</span>S’entraîner</h3>
    <ul><li>Touchez n’importe quelle zone d’un modèle pour savoir quelle structure s’y trouve. Rien n’est noté : profitez-en avant l’évaluation.</li>
      <li>Tournez le modèle en le faisant glisser, zoomez en pinçant ou avec la molette, masquez les calques qui gênent. Pour le cheval et le porc, « Entrer dans l’estomac » montre la muqueuse.</li></ul>
    <button class="lien" data-aller="explorer">Aller à l’onglet S’entraîner</button>
  </section>
  <section><h3><span class="n">${PORTAIL?2:3}</span>Évaluation finale <span class="tag-ng">notée sur ${f1(P.reperage+P.quiz)} · ${c.dureeEval} min</span></h3>
    <ul>
      <li>${ident}</li>
      <li><b>Repérage sur les modèles :</b> ${c.nbReperage} structures à toucher, réparties sur les espèces. Le modèle s’ouvre tout seul. Tournez-le, masquez des calques ou entrez dans l’estomac si besoin, puis touchez la structure <b>une seule fois</b>. La bonne réponse s’affiche en vert en cas d’erreur.</li>
      <li><b>Quiz :</b> ${c.nbQuestions} questions QCM et vrai/faux tirées au hasard dans le cours. Une seule réponse par question ; la correction et une explication s’affichent aussitôt.</li>
      <li>${PORTAIL?'Sur le téléphone du duo, juste après le jeu.':'Chacun sur son appareil, en même temps.'} Minuteur de ${c.dureeEval} minutes dès la première épreuve commencée : à la fin du temps, tout est enregistré, les questions sans réponse comptent zéro.</li>
      <li>Chaque épreuve ne peut être faite <b>qu’une fois</b>. Vous pouvez faire le repérage ou le quiz dans l’ordre que vous voulez. Si vous fermez la page, vous reprenez où vous en étiez.</li>
      <li>Les épreuves sont identiques pour tous les binômes et ne dépendent pas du jeu.</li>
    </ul>
    <div class="bareme"><span>Repérage sur les modèles</span><b>${f1(P.reperage)} pts</b><span>Quiz</span><b>${f1(P.quiz)} pts</b><span><b style="text-align:left">Total</b></span><b>${f1(P.reperage+P.quiz)} pts</b></div>
    ${LMS?'<p class="muted">La note est envoyée automatiquement au carnet de notes Moodle.</p>':''}
    <button class="lien" data-aller="quiz">Aller à l’onglet Évaluation</button>
  </section></div>`;}

/* ---------- Navigation ---------- */
function grp(e){return e.groupe||e.id;}
/* Vues utilisées pour la validation et les repères ; les autres vues servent seulement à l'entraînement */
const VALIDATION=['chien_seg','chat','cheval','vache','vache_rumen','porc','lapin','vaisseaux'];
const modeEval=()=>S.mode==='valider'||S.mode==='prof';
function vueValide(id){if(VALIDATION.includes(id))return id;const g=grp(ESPECES.find(e=>e.id===id));return ESPECES.find(e=>grp(e)===g&&VALIDATION.includes(e.id))?.id||id;}
function choisir(id){if(modeEval())id=vueValide(id);if(S.espece===id)return;S.espece=id;S.quiz=null;S.explore=null;S.brouillon=null;renderSpecies();renderPanel();loadEspece(id);}
function renderSpecies(){
  const el=document.getElementById('species');el.innerHTML='';const cur=ESPECES.find(e=>e.id===S.espece);
  ESPECES.filter(e=>!e.groupe).forEach(e=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=e.nom;
    b.style.setProperty('--sp',e.couleur);b.setAttribute('aria-pressed',String(grp(cur)===e.id));
    if(!e.modele&&!e.genere)b.title='Modèle 3D à venir';
    b.onclick=()=>choisir(e.id);el.append(b);});
  const v=document.getElementById('vues');v.innerHTML='';const autres=ESPECES.filter(e=>grp(e)===grp(cur)&&(!modeEval()||VALIDATION.includes(e.id)));
  if(autres.length>1)autres.forEach(e=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=e.vue||e.nom;
    b.style.setProperty('--sp',e.couleur);b.setAttribute('aria-pressed',String(e.id===S.espece));b.onclick=()=>choisir(e.id);v.append(b);});
  v.hidden=autres.length<2;
}
function setMode(m){const avant=S.mode;S.mode=m;S.quiz=null;S.explore=null;S.brouillon=null;S.qz=null;S.rp=null;surligner(null);document.body.dataset.mode=m;
  if(modeEval()&&vueValide(S.espece)!==S.espece){S.espece=vueValide(S.espece);loadEspece(S.espece);}renderSpecies();
  for(const [id,mm] of [['tab-jeu','jeu'],['tab-valider','valider'],['tab-explorer','explorer'],['tab-quiz','quiz'],['tab-consignes','consignes'],['joueur','profil'],['tab-notes','notes'],['tab-prof','prof']])document.getElementById(id).setAttribute('aria-selected',String(mm===m));
  drawPins();renderPanel();requestAnimationFrame(resize);}
document.getElementById('tab-valider').onclick=()=>setMode('valider');
document.getElementById('tab-jeu').onclick=()=>setMode('jeu');
document.getElementById('tab-explorer').onclick=()=>setMode('explorer');
document.getElementById('tab-prof').onclick=()=>setMode('prof');
document.getElementById('tab-quiz').onclick=()=>setMode('quiz');
document.getElementById('tab-consignes').onclick=()=>setMode('consignes');
document.getElementById('joueur').onclick=()=>setMode('profil');
document.getElementById('tab-notes').onclick=()=>setMode('notes');

/* ---------- Démarrage ---------- */
function loop(){requestAnimationFrame(loop);controls.update();sun.position.copy(camera.position);renderer.render(scene,camera);updateLabels();}
async function boot(){
  chargerEval();if(!PORTAIL)chargerPartie();S.mode=PORTAIL&&PORTAIL.embed?'attente':'consignes';
  if(MAISON){document.getElementById('tab-quiz').textContent='Révisions';const h1=document.querySelector('header h1');if(h1)h1.textContent='7 familles digestives';}
  if(PORTAIL){document.getElementById('tab-jeu').hidden=true;document.body.dataset.portail='1';
    if(PORTAIL.embed)document.body.dataset.jeuval=document.body.dataset.embed='1';
    else{const r=document.getElementById('portail-retour');r.hidden=false;r.onclick=()=>{try{if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){history.back();return;}}catch(e){}location.href='../';};}}if(P&&P.phase==='validation'){P.phase='complete';sauverPartie();}
  for(const [id,mm] of [['tab-consignes','consignes'],['tab-jeu','jeu'],['tab-quiz','quiz']])document.getElementById(id).setAttribute('aria-selected',String(mm===S.mode));
  if(bin())S.binome=bin().nom;document.body.dataset.mode=S.mode;
  resize();loop();renderSpecies();renderPanel();
  try{S.reperes=JSON.parse(document.getElementById('reperes-data').textContent)||{};}catch(e){S.reperes={};}
  try{const r=await fetch('data/reperes.json',{cache:'no-store',credentials:'include'});if(r.ok){const d=await r.json();if(d&&typeof d==='object')S.reperes=d;}}catch(e){}
  try{const d=sessionStorage.getItem('reperes-brouillon');if(d){S.reperes=JSON.parse(d);S.dirty=true;S.saveMsg='Brouillon non enregistré récupéré.';}}catch(e){}
  renderPanel();loadEspece(S.espece);
  if(PORTAIL&&PORTAIL.embed){try{parent.postMessage({tp3:'pret'},'*');}catch(e){}}
  if(!PORTAIL&&window.claude&&window.claude.use){
    window.claude.use('user').then(async u=>{
      const can=u?await u.canEdit():false;S.canEdit=!!can;
      document.getElementById('tab-prof').hidden=!can;document.getElementById('tab-notes').hidden=!can;
      if(can){S.artifact=await window.claude.use('artifact');N.db=await claudeUse('db');await chargerCarnetDb();}
      renderPanel();
    }).catch(()=>{});
  }
}
boot();
</script>

<script>/* Envoi direct des notes de l'atelier 3 au serveur (repris de la version du portail de l'équipe) */
(function(){
  var q=new URLSearchParams(location.search), duos=null;
  if(q.get("embed")==="1")return;
  try{duos=JSON.parse(q.get("duos")||"null")}catch(e){}
  if(!duos||!duos.length)return;
  var K="tp-digestif-eval-v1";
  /* relance de l'évaluation demandée par un encadrant (config/a3raz) : l'évaluation de ce duo est effacée sur ce téléphone, puis la page est rechargée */
  (function(){var duo=q.get("duo");if(!duo)return;var dbV=(window.claude&&window.claude.use?window.claude.use("db"):Promise.resolve(null));
    dbV.then(function(db){if(!db)return;return db.collection("config").doc("a3raz").get().then(function(s){var d=s&&s.exists?s.data():null;var ts=d&&+d[duo];if(!ts)return;
      var k="a3-raz-vu-"+duo;if(+localStorage.getItem(k)>=ts)return;
      try{var e=JSON.parse(localStorage.getItem(K)||"null");if(e&&e.binomes){Object.keys(e.binomes).forEach(function(id){if(id===duo||e.courant===id){var b=e.binomes[id];["reperage","quiz","evalFini","evalDebut","quizEnCours","epreuveEnCours"].forEach(function(f){delete b[f]})}});localStorage.setItem(K,JSON.stringify(e))}}catch(er){}
      try{var f=JSON.parse(localStorage.getItem("a3fileEnvoi")||"[]").filter(function(x){return x.id!==duo});localStorage.setItem("a3fileEnvoi",JSON.stringify(f))}catch(er){}
      localStorage.setItem(k,String(ts));location.reload()})}).catch(function(){})})();
  /* évaluation déjà notée pour ce duo (sur ce téléphone ou un autre) : on ne peut plus la refaire, même après un rechargement */
  (function(){var duo=q.get("duo");if(!duo||String(duo).indexOf("TEST")===0||q.get("eval")===null)return;
    var dbV=(window.claude&&window.claude.use?window.claude.use("db"):Promise.resolve(null));
    dbV.then(function(db){if(!db)return;return db.collection("notes_a3").doc(duo).get().then(function(s){if(!s||!s.exists)return;var d=s.data()||{};
      var o=document.createElement("div");o.id="a3fini";o.style.cssText="position:fixed;inset:0;z-index:99999;background:rgba(20,22,20,.94);color:#fff;display:flex;align-items:center;justify-content:center;padding:20px;font-family:system-ui,sans-serif";
      o.innerHTML='<div style="max-width:520px;text-align:center"><div style="font-size:52px">✓</div><h2 style="margin:6px 0 10px;font-size:26px">Évaluation terminée pour votre duo</h2><p style="font-size:18px;margin:0 0 8px">Votre note est enregistrée'+(d.note!=null?' : <b>'+String(d.note).replace(".",",")+' / 20</b>':'')+'.</p><p style="font-size:16px;opacity:.85;margin:0 0 18px">L’évaluation ne peut pas être refaite. Si l’enseignant vous y autorise, donnez-lui ce code : <b style="font-size:20px">'+String(duo).replace(/^[^-]*-/,"").toUpperCase()+'</b></p><a href="../index.html" style="display:inline-block;background:#fff;color:#1d1f1c;padding:12px 22px;border-radius:12px;font-weight:700;text-decoration:none">Retour au portail des ateliers</a></div>';
      var poser=function(){if(!document.getElementById("a3fini"))document.body.appendChild(o)};poser();setInterval(poser,1000)})}).catch(function(e){console.warn("verrou a3",e)})})();
  /* envoi direct des notes au serveur, sans attendre le retour sur le portail (téléphone éteint, oubli…) */
  if(duos){var FILE="a3fileEnvoi",envoyes={};
    function noteDe(b){if(!b||!b.reperage||!b.reperage.total||!b.quiz||b.quiz.score==null||!b.quiz.total)return null;return Math.round((b.reperage.score/b.reperage.total*10+b.quiz.score/b.quiz.total*10)*10)/10}
    function file(){try{return JSON.parse(localStorage.getItem(FILE)||"[]")}catch(e){return []}}
    function poser(l){try{localStorage.setItem(FILE,JSON.stringify(l))}catch(e){}}
    function preparer(){var d;try{d=JSON.parse(localStorage.getItem(K)||"null")}catch(e){}if(!d||!d.binomes)return;var l=file(),ids=duos.map(function(x){return x.id});
      Object.keys(d.binomes).forEach(function(id){if(ids.indexOf(id)<0)return;var b=d.binomes[id];
        var prog={reperage:b.reperage&&b.reperage.total?{score:b.reperage.score,total:b.reperage.total,det:b.reperage.det||null}:null,quiz:b.quiz&&b.quiz.total&&b.quiz.score!=null?{score:b.quiz.score,total:b.quiz.total,det:b.quiz.det||null}:null};
        var cle=JSON.stringify(prog);if(envoyes[id]===cle||(!prog.reperage&&!prog.quiz))return;envoyes[id]=cle;
        l=l.filter(function(x){return x.id!==id});l.push({id:id,prog:prog,note:noteDe(b),t:Date.now()})});poser(l)}
    var dbP=null;function base(){if(!dbP)dbP=(window.claude&&window.claude.use?window.claude.use("db"):Promise.resolve(null)).catch(function(){return null});return dbP}
    function vider(){var l=file();if(!l.length)return;base().then(function(db){if(!db)return;l.forEach(function(x){
      var p=[db.collection("a3prog").doc(x.id).set({reperage:x.prog.reperage,quiz:x.prog.quiz,maj:x.t})];
      /* la meilleure note du duo est gardée : une note plus basse (autre téléphone, épreuve vide) ne remplace jamais une meilleure */
      if(x.note!=null){var rn=db.collection("notes_a3").doc(x.id);p.push(rn.get().then(function(s){var d=s&&s.exists?s.data():null;if(d&&d.note!=null&&+d.note>=+x.note)return;return rn.set({note:x.note,reperage:x.prog.reperage,quiz:x.prog.quiz,maj:x.t,direct:1})}))}
      Promise.all(p).then(function(){poser(file().filter(function(y){return !(y.id===x.id&&y.t===x.t)}))}).catch(function(){})})})}
    var orig=Storage.prototype.setItem;Storage.prototype.setItem=function(k,v){orig.apply(this,arguments);if(k===K)setTimeout(function(){preparer();vider()},50)};
    setInterval(function(){preparer();vider()},15000);window.addEventListener("online",vider);setTimeout(vider,2000)}
})();</script>

<script>window.__CONFIRM_SEL__="[data-opt],[data-eopt]";
/* quiz : on choisit sa réponse, puis on la valide (évite les réponses données par erreur) */
(function(){var SEL=window.__CONFIRM_SEL__;if(!SEL)return;var choix=null,bar=null;
  function cle(b){var a=b.attributes,k=[];for(var i=0;i<a.length;i++)if(/^data-/.test(a[i].name))k.push(a[i].name+"="+a[i].value);return (k.length?k.join("&"):"t="+b.textContent.trim())+"|"+(b.closest("[id]")||{}).id}
  function trouver(){if(!choix)return null;var l=document.querySelectorAll(SEL);for(var i=0;i<l.length;i++)if(cle(l[i])===choix)return l[i];return null}
  function barre(){if(!bar){bar=document.createElement("div");bar.id="confirmBar";bar.style.cssText="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9500;display:none;gap:8px;align-items:center;background:#1d1f1c;color:#fff;padding:10px 12px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.3);font:600 16px system-ui,sans-serif";
    bar.innerHTML='<span style="padding:0 6px">Votre choix est fait ?</span><button type="button" id="confirmOk" style="background:#2f7a4a;color:#fff;border:0;border-radius:999px;padding:10px 18px;font:700 16px system-ui,sans-serif;cursor:pointer">Valider ma réponse</button><button type="button" id="confirmNon" style="background:transparent;color:#fff;border:1px solid #888;border-radius:999px;padding:9px 14px;font:600 15px system-ui,sans-serif;cursor:pointer">Changer</button>';
    document.body.appendChild(bar);
    bar.querySelector("#confirmOk").addEventListener("click",function(){var b=trouver();choix=null;sync();if(!b||b.disabled)return;var ev=new MouseEvent("click",{bubbles:true,cancelable:true});ev.__confirme=true;b.dispatchEvent(ev)});
    bar.querySelector("#confirmNon").addEventListener("click",function(){choix=null;sync()})}return bar}
  function sync(){var l=document.querySelectorAll(SEL),b=trouver();for(var i=0;i<l.length;i++){if(l[i]===b){l[i].style.outline="4px solid #2f7a4a";l[i].style.outlineOffset="2px";l[i].setAttribute("aria-pressed","true")}else if(l[i].style.outline){l[i].style.outline="";l[i].style.outlineOffset="";l[i].removeAttribute("aria-pressed")}}
    if(choix&&!b)choix=null;barre().style.display=choix?"flex":"none"}
  document.addEventListener("click",function(e){if(e.__confirme)return;var b=e.target.closest&&e.target.closest(SEL);if(!b||b.disabled)return;
    e.stopImmediatePropagation();e.preventDefault();choix=cle(b);sync()},true);
  setInterval(sync,300)})();
</script>
