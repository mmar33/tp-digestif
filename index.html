<script>/* remise à zéro des téléphones : quand RAZ change, chaque appareil efface tout ce qu'il gardait (cache, identité, file d'envoi, base locale) puis recharge. Ne pas changer RAZ pendant une séance. */
(function(){var RAZ="1";try{if(localStorage.getItem("__raz")===RAZ)return;}catch(e){return}
var fin=function(){try{localStorage.clear();sessionStorage.clear();localStorage.setItem("__raz",RAZ)}catch(e){}location.reload()};
try{localStorage.clear();sessionStorage.clear()}catch(e){}try{window.stop()}catch(e){}document.documentElement.style.visibility="hidden";
var p=[];try{if(navigator.serviceWorker)p.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister()}))}))}catch(e){}
try{if(window.caches)p.push(caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}))}catch(e){}
try{if(indexedDB.databases)p.push(indexedDB.databases().then(function(d){d.forEach(function(x){if(x.name)indexedDB.deleteDatabase(x.name)})}))}catch(e){}
Promise.all(p).then(fin,fin);setTimeout(fin,3000)})();</script>

<script>
/* Mode local : remplace les services claude.ai (db, user, downloads) quand l'application
   est ouverte hors de claude.ai (fichier, Moodle, serveur web). Les données sont enregistrées
   dans le navigateur de l'appareil (localStorage) et partagées entre les pages et onglets
   du même site, mais pas entre appareils. Sur claude.ai, ce module ne fait rien. */
(function(){
  if ((window.claude && window.claude.use) || window.APP_CONFIG) return;
  var P = "cl-db:", L = "cl-lease:";
  var ls = (function(){ try{ var k="__cl_t"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return localStorage; }catch(e){ return null; } })();
  var mem = {};
  function sget(k){ if(ls){ try{ return ls.getItem(k); }catch(e){} } return Object.prototype.hasOwnProperty.call(mem,k) ? mem[k] : null; }
  function sset(k,v){ if(ls){ try{ ls.setItem(k,v); return; }catch(e){} } mem[k]=v; }
  function sdel(k){ if(ls){ try{ ls.removeItem(k); }catch(e){} } delete mem[k]; }
  function skeys(){ var out=[]; if(ls){ try{ for(var i=0;i<ls.length;i++) out.push(ls.key(i)); }catch(e){} } for(var k in mem) if(out.indexOf(k)<0) out.push(k); return out; }

  function clone(v){ return v===undefined ? undefined : JSON.parse(JSON.stringify(v)); }
  function deepFreeze(o){ if(o && typeof o==="object"){ Object.freeze(o); Object.keys(o).forEach(function(k){ deepFreeze(o[k]); }); } return o; }
  function segs(p){ return String(p).replace(/^\/+|\/+$/g,"").split("/").filter(Boolean); }
  function err(code,msg){ var e=new Error(msg||code); e.code=code; return e; }
  function readDoc(path){ var r=sget(P+path); if(!r) return null; try{ return JSON.parse(r); }catch(e){ return null; } }
  function writeDoc(path,data,v){ sset(P+path, JSON.stringify({data:data, v:v})); notify(); }
  function autoId(){ var c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789", s=""; for(var i=0;i<20;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
  function mergeDeep(a,b){ var out=clone(a)||{}; Object.keys(b).forEach(function(k){ var bv=b[k];
    if(bv && typeof bv==="object" && !Array.isArray(bv) && out[k] && typeof out[k]==="object" && !Array.isArray(out[k])) out[k]=mergeDeep(out[k],bv);
    else out[k]=clone(bv); }); return out; }
  function getField(o,f){ return String(f).split(".").reduce(function(x,k){ return x==null?undefined:x[k]; }, o); }
  function cmp(a,b){ if(a===b) return 0; if(a===undefined||a===null) return -1; if(b===undefined||b===null) return 1; return a<b?-1:a>b?1:0; }
  function test(v,op,x){
    switch(op){
      case "==": case "eq": return JSON.stringify(v)===JSON.stringify(x);
      case "!=": case "ne": return JSON.stringify(v)!==JSON.stringify(x);
      case "<": case "lt": return v!==undefined && cmp(v,x)<0;
      case "<=": case "lte": return v!==undefined && cmp(v,x)<=0;
      case ">": case "gt": return v!==undefined && cmp(v,x)>0;
      case ">=": case "gte": return v!==undefined && cmp(v,x)>=0;
      case "in": return Array.isArray(x) && x.some(function(y){ return JSON.stringify(y)===JSON.stringify(v); });
      case "not-in": return Array.isArray(x) && !x.some(function(y){ return JSON.stringify(y)===JSON.stringify(v); });
      case "array-contains": return Array.isArray(v) && v.some(function(y){ return JSON.stringify(y)===JSON.stringify(x); });
      case "array-contains-any": return Array.isArray(v) && Array.isArray(x) && v.some(function(y){ return x.some(function(z){ return JSON.stringify(y)===JSON.stringify(z); }); });
    }
    return false;
  }
  var META={fromCache:false, hasPendingWrites:false};
  function docSnap(path){ var id=segs(path).pop(), r=readDoc(path), d=r?deepFreeze(clone(r.data)):undefined;
    return {id:id, exists:!!r, data:function(){ return d; }, metadata:META, _v:r?r.v:0}; }

  /* ---- abonnements ---- */
  var subs=[];
  var pending=false;
  function notify(){ if(pending) return; pending=true; setTimeout(function(){ pending=false; subs.slice().forEach(function(s){ try{ s.check(); }catch(e){} }); },0); }
  window.addEventListener("storage", function(e){ if(!e.key || e.key.indexOf(P)===0) notify(); });

  function docRef(path){
    var sg=segs(path); if(sg.length%2!==0) throw err("invalid_argument","Chemin de document invalide : "+path);
    path=sg.join("/");
    var ref={ id:sg[sg.length-1], path:path,
      get:function(){ return Promise.resolve(docSnap(path)); },
      set:function(data){ var r=readDoc(path); writeDoc(path, clone(data)||{}, (r?r.v:0)+1); return Promise.resolve(); },
      update:function(data){ var r=readDoc(path); if(!r) return Promise.reject(err("invalid_argument","Document absent : "+path)); writeDoc(path, mergeDeep(r.data,data||{}), r.v+1); return Promise.resolve(); },
      delete:function(){ sdel(P+path); sdel(L+path); notify(); return Promise.resolve(); },
      collection:function(p){ return colRef(path+"/"+p); },
      acquire:function(o){ o=o||{}; var ttl=Math.min(600000,Math.max(1000,o.ttlMs||30000)), now=Date.now(), cur=null;
        try{ cur=JSON.parse(sget(L+path)||"null"); }catch(e){}
        if(cur && cur.exp>now && cur.holder!==o.holder) return Promise.resolve({acquired:false, expiresAt:new Date(cur.exp).toISOString()});
        var exp=now+ttl; sset(L+path, JSON.stringify({holder:o.holder, exp:exp}));
        var r=readDoc(path), v=(r?r.v:0)+1; writeDoc(path, mergeDeep(r?r.data:{}, o.data||{}), v);
        return Promise.resolve({acquired:true, version:v, expiresAt:new Date(exp).toISOString(), holder:o.holder}); },
      release:function(o){ var cur=null; try{ cur=JSON.parse(sget(L+path)||"null"); }catch(e){} if(cur && (!o||!o.holder||cur.holder===o.holder)) sdel(L+path); return Promise.resolve(); },
      onSnapshot:function(next, error){ if(typeof next==="object" && next && next.next){ error=next.error; next=next.next; }
        var last=null, alive=true;
        var s={check:function(){ if(!alive) return; var sn=docSnap(path), sig=sn.exists?sn._v+":"+JSON.stringify(sn.data()):"absent"; if(sig===last) return; last=sig; try{ next(sn); }catch(e){ if(error) error(e); } }};
        subs.push(s); setTimeout(s.check,0);
        return function(){ alive=false; subs=subs.filter(function(x){ return x!==s; }); }; }
    };
    return ref;
  }

  function colRef(path, q){
    var sg=segs(path); if(sg.length%2!==1) throw err("invalid_argument","Chemin de collection invalide : "+path);
    path=sg.join("/"); q=q||{w:[], o:[], l:0};
    function run(){
      var pre=P+path+"/", docs=[];
      skeys().forEach(function(k){ if(k.indexOf(pre)!==0) return; var rest=k.slice(pre.length); if(!rest || rest.indexOf("/")>=0) return; docs.push(docSnap(path+"/"+rest)); });
      docs=docs.filter(function(d){ return d.exists && q.w.every(function(c){ return test(getField(d.data(),c[0]),c[1],c[2]); }); });
      if(q.o.length) docs.sort(function(a,b){ for(var i=0;i<q.o.length;i++){ var c=cmp(getField(a.data(),q.o[i][0]),getField(b.data(),q.o[i][0])); if(c) return q.o[i][1]==="desc"?-c:c; } return 0; });
      else docs.sort(function(a,b){ return a.id<b.id?-1:a.id>b.id?1:0; });
      if(q.l) docs=docs.slice(0,q.l);
      return docs;
    }
    function qsnap(docs, prev){
      var changes=docs.map(function(d,i){ var old=prev?prev.findIndex(function(p){ return p.id===d.id; }):-1; return {type:old<0?"added":"modified", doc:d, oldIndex:old, newIndex:i}; });
      if(prev) prev.forEach(function(p,i){ if(!docs.some(function(d){ return d.id===p.id; })) changes.push({type:"removed", doc:p, oldIndex:i, newIndex:-1}); });
      return {docs:docs, size:docs.length, empty:!docs.length, docChanges:function(){ return changes; }, metadata:META, forEach:function(f){ docs.forEach(f); }};
    }
    var ref={ id:sg[sg.length-1], path:path,
      doc:function(id){ return docRef(path+"/"+(id||autoId())); },
      add:function(data){ var d=docRef(path+"/"+autoId()); return d.set(data).then(function(){ return d; }); },
      where:function(f,op,v){ return colRef(path,{w:q.w.concat([[f,op,v]]), o:q.o, l:q.l}); },
      orderBy:function(f,dir){ return colRef(path,{w:q.w, o:q.o.concat([[f,dir||"asc"]]), l:q.l}); },
      limit:function(n){ return colRef(path,{w:q.w, o:q.o, l:n}); },
      get:function(){ return Promise.resolve(qsnap(run(),null)); },
      onSnapshot:function(next, error){ if(typeof next==="object" && next && next.next){ error=next.error; next=next.next; }
        var lastSig=null, lastDocs=null, alive=true;
        var s={check:function(){ if(!alive) return; var docs=run(), sig=JSON.stringify(docs.map(function(d){ return [d.id,d._v,d.data()]; })); if(sig===lastSig) return;
          var sn=qsnap(docs,lastDocs); lastSig=sig; lastDocs=docs; try{ next(sn); }catch(e){ if(error) error(e); } }};
        subs.push(s); setTimeout(s.check,0);
        return function(){ alive=false; subs=subs.filter(function(x){ return x!==s; }); }; }
    };
    return ref;
  }

  var db={ doc:function(p){ return docRef(p); }, collection:function(p){ return colRef(p); } };

  /* ---- identité de l'appareil ---- */
  var uid=sget("cl-user-id"); if(!uid){ uid="local-"+autoId().slice(0,12); sset("cl-user-id",uid); }
  try{ var qs=new URLSearchParams(location.search); if(qs.get("enseignant")==="1") sset("cl-enseignant","1"); if(qs.get("enseignant")==="0") sdel("cl-enseignant"); }catch(e){}
  function teacher(){ return sget("cl-enseignant")==="1"; }
  var user={ id:function(){ return Promise.resolve(uid); },
    me:function(){ return Promise.resolve({id:uid, email:null, name:"", isMe:true, isOwner:teacher(), canEdit:teacher()}); },
    canEdit:function(){ return Promise.resolve(teacher()); },
    isOwner:function(){ return Promise.resolve(teacher()); },
    can:function(){ return Promise.resolve(teacher()); },
    profiles:function(ids){ var o={}; (ids||[]).forEach(function(i){ o[i]={id:i, name:"", email:null, isMe:i===uid}; }); return Promise.resolve(o); } };

  /* ---- téléchargements ---- */
  var downloads={ save:function(req){ try{
      var d=req.data, blob = d instanceof Blob ? d : new Blob([d], {type:req.mimeType||"application/octet-stream"});
      var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=req.filename||"fichier";
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
      return Promise.resolve({saved:true, filename:a.download});
    }catch(e){ return Promise.reject(err("failed", String(e))); } } };

  window.claude={ local:true, use:function(name){
    if(name==="db") return Promise.resolve(db);
    if(name==="user") return Promise.resolve(user);
    if(name==="downloads") return Promise.resolve(downloads);
    return Promise.resolve(null); /* assets, artifact, sample… : indisponibles hors claude.ai */
  } };
})();

<style>
/* Mise en page : planche du Barone à gauche, carnet de réponses à droite ; tableau de score en haut ; empilé sur téléphone */
:root{
  --paper:#f6f6f2; --sheet:#ffffff; --ink:#1d1f1c; --muted:#62675f; --rule:#d9dbd2;
  --pen:#c0262d; --pen-soft:#fbe9e8; --ok:#2f7a4a; --ok-soft:#e5f2e8; --warn:#a96a00; --warn-soft:#fbf0dc; --blue:#1f5d8c; --blue-soft:#e4eef7;

  --display:"Bricolage Grotesque","Archivo",system-ui,sans-serif; --body:"Archivo",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#161816; --sheet:#20231f; --ink:#ecefe8; --muted:#a3a99f; --rule:#363a34;
  --pen:#ff6b6b; --pen-soft:#3a1f1f; --ok:#6fcf8f; --ok-soft:#1d3324; --warn:#e3a43c; --warn-soft:#352a14; --blue:#7ab8e8; --blue-soft:#1b2a37;
  --teamA:#ff6b6b; --teamB:#7ab8e8; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#161816; --sheet:#20231f; --ink:#ecefe8; --muted:#a3a99f; --rule:#363a34;
  --pen:#ff6b6b; --pen-soft:#3a1f1f; --ok:#6fcf8f; --ok-soft:#1d3324; --warn:#e3a43c; --warn-soft:#352a14; --blue:#7ab8e8; --blue-soft:#1b2a37;
  --teamA:#ff6b6b; --teamB:#7ab8e8; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-stretch:80%;line-height:1.1;text-wrap:balance;margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-block:16px 32px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:6px;font-weight:650}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.pen{background:var(--pen);border-color:var(--pen);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{padding:5px 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:14px}
.note{font-size:14px;color:var(--muted)}
.lvl{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 6px;border-radius:3px;letter-spacing:.04em;white-space:nowrap}
.lvl.F{background:var(--ok-soft);color:var(--ok)} .lvl.M{background:var(--warn-soft);color:var(--warn)} .lvl.D{background:var(--pen-soft);color:var(--pen)}
.tag{font-family:var(--mono);font-size:13px;font-weight:600;padding:3px 8px;border-radius:4px;white-space:nowrap}
.tag.m1{background:var(--pen-soft);color:var(--pen)} .tag.m2{background:var(--blue-soft);color:var(--blue)} .tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.w{background:var(--warn-soft);color:var(--warn)}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:16px}
.card h3{font-size:20px;margin-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:6px;font-weight:600;z-index:20}
.field{display:grid;gap:4px;font-weight:600;flex:1 1 200px}
.field input{padding:10px 12px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet)}

/* Accueil */
.home{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:start;padding-top:24px}
.home h1{font-size:clamp(42px,6.5vw,80px);font-weight:800;letter-spacing:-.01em}
.home h1 .a{color:var(--teamA)} .home h1 .b{color:var(--teamB)}
.rules{display:grid;gap:12px;margin:22px 0}
.rule{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;border-top:1px solid var(--rule);padding-top:12px}
.actions{display:grid;gap:14px}
.duels{display:grid;gap:8px}
.duel{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--rule);border-radius:6px;padding:10px 12px;background:var(--sheet)}
.vs{font-weight:700}.vs .a{color:var(--teamA)}.vs .b{color:var(--teamB)}
.code{font-family:var(--mono);font-weight:600;letter-spacing:.12em}

/* Salle d'attente / compte à rebours */
.center{max-width:720px;margin:40px auto;display:grid;gap:18px;text-align:center;justify-items:center}
.huge{font-family:var(--mono);font-weight:600;font-size:clamp(80px,18vw,180px);line-height:1}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;width:100%}
.team{border:2px solid var(--rule);border-radius:8px;padding:16px;font-weight:700;font-size:22px}
.team.a{border-color:var(--teamA);color:var(--teamA)} .team.b{border-color:var(--teamB);color:var(--teamB)}
.team small{display:block;font-size:13px;font-weight:600;color:var(--muted)}

/* Jeu */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;padding-block:10px;border-bottom:1px solid var(--rule)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.timer{font-family:var(--mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--pen)}
.score{display:flex;gap:8px;align-items:center;font-weight:700}
.score .pill{font-family:var(--mono);font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:5px;color:#fff;font-size:18px}
.score .pa{background:var(--teamA)} .score .pb{background:var(--teamB)}
.score .me{outline:3px solid var(--ink);outline-offset:1px}
.bar .sp{flex:1}
.count{display:flex;gap:4px;flex-wrap:wrap}
.count span{font-family:var(--mono);font-size:11px;font-weight:600;width:24px;height:24px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center;color:var(--muted)}
.count span.f{background:var(--ok);border-color:var(--ok);color:#fff}
.count span.j{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.count span.h{border-color:var(--pen);color:var(--pen)}
.game{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start;padding-top:16px}
.plate{background:#fff;border:1px solid var(--rule);border-radius:4px;padding:10px;color:#222}
.plate .stage{position:relative;cursor:crosshair;touch-action:manipulation;margin:0 auto}
.plate img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
.plate svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.caption{text-align:center;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#555;padding-top:6px}
.zoom{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px;align-items:center}
.zoom button{border:1px solid #ccc;background:#fff;color:#222;border-radius:4px;padding:4px 10px;font-size:14px}
.zoom .note{color:#666;margin-right:auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:grid;gap:14px}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:left;border:1.5px solid var(--rule);background:var(--sheet);padding:10px 12px;border-radius:6px;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default;opacity:.8}
.opt.sel{border-color:var(--ink);font-weight:650}
.fb{margin-top:10px;padding:8px 12px;border-radius:6px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)} .fb.ko{background:var(--pen-soft);color:var(--pen)}

@media (prefers-reduced-motion:no-preference){.barone.libre{animation:bxp 1.8s ease-in-out infinite}@keyframes bxp{50%{transform:scale(1.02)}}.barone.moi.urgent{animation:bxu .6s ease-in-out infinite}@keyframes bxu{50%{transform:scale(1.015)}}}

}

/* Résultat et enseignant */

/* ---------- affinage visuel et ergonomie tablette ---------- */
:root{--r:12px;--lift:0 1px 2px rgba(25,30,22,.05),0 6px 18px rgba(25,30,22,.06)}

body{font-size:17px;-webkit-tap-highlight-color:transparent}
.card{border-radius:var(--r);box-shadow:var(--lift)}

.banner{border-radius:var(--r)}

.fb{border-radius:10px;padding:10px 14px}
.bar{gap:10px 16px;padding-block:10px 12px}
.timebox{display:grid;gap:5px;justify-items:start}

.tprog i.low{background:var(--pen)}
.count span{width:30px;height:30px;font-size:12px}
.score .pill{border-radius:8px;padding:5px 12px}
.plate{border-radius:var(--r);box-shadow:var(--lift);border-color:transparent}
.zoom button{border-radius:8px;min-height:36px;padding:4px 12px;font-weight:600}

.qimg{border-radius:var(--r);box-shadow:var(--lift);border-color:transparent}

.side{gap:12px}

 @keyframes inA{from{transform:translateX(-30px);opacity:0}}@keyframes inB{from{transform:translateX(30px);opacity:0}}}

oits.", "Le lobe caudé n'a qu'un processus.", "Ce sont les lobes carré et caudé."], "clin": "Le lobe caudé porte un processus caudé, à droite (empreinte rénale), et un processus papillaire, près de la petite courbure de l'estomac."}, {"titre": "« Empreinte rénale » et « Empreinte gastrique »", "niv": "M", "zones": [[85, 749, 224, 770], [721, 67, 858, 88]], "bonne": "Empreintes rénale et gastrique sont inversées.", "fausses": ["Ce sont deux empreintes œsophagiennes.", "Le foie du chien ne porte pas d'empreinte.", "Ce sont les deux bords du foie."], "clin": "La face viscérale du foie porte l'empreinte gastrique à gauche et l'empreinte rénale (rein droit) sur le processus caudé."}, {"titre": "« Lobe carré » et « Lobe droit médial »", "niv": "M", "zones": [[779, 752, 904, 770], [708, 868, 830, 886]], "bonne": "Lobe carré et lobe droit médial sont inversés.", "fausses": ["Ce sont les deux lobes gauches.", "Les deux désignent le lobe caudé.", "Le lobe carré n'existe pas chez le chien."], "clin": "Le lobe carré est central, entre les lobes gauche médial et droit médial ; la vésicule biliaire se loge à côté."}]},

function choisirPlanche(){

/* pioche partagée : chaque duel tire une planche différente, la pioche est rebattue chaque jour ou quand elle est vide */
async function tirerPlanche(){
  const ids=Object.keys(PLANCHES), jour=new Date().toDateString();
  if(!db)return choisirPlanche();
  const ref=db.collection("config").doc("pioche"), moiH="t"+Math.random().toString(36).slice(2,8);
  for(let essai=0;essai<4;essai++){
    try{const r=await ref.acquire({holder:moiH,ttlMs:6000});
      if(r.acquired){const snap=await ref.get(); const d=snap.exists?snap.data():{};
        let reste=(d.jour===jour&&Array.isArray(d.reste))?d.reste.filter(x=>ids.includes(x)):[];
        if(!reste.length){reste=shuffle(ids); if(reste[0]===d.derniere&&reste.length>1)reste.push(reste.shift())}
        const k=reste.shift(); await ref.set({jour,reste,derniere:k,maj:Date.now()}); LS.set("dernierePlanche",k); return k}
    }catch(e){}
    await new Promise(r=>setTimeout(r,1200));
  }
  return choisirPlanche();
}

let baroneMus=null, baroneEtaitMoi=false;
function audioCtx(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;bip.ctx=bip.ctx||new C();return bip.ctx}
function note(c,f,t,d,v,type){const o=c.createOscillator(),g=c.createGain();o.type=type||"triangle";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.05)}
function demarrerMusique(){if(baroneMus||!sonOn)return;const c=audioCtx();if(!c)return;
  const motif=[392,494,587,494,440,523,659,523], basse=[98,98,110,110];let k=0;
  baroneMus=setInterval(()=>{const e=etatBarone();if(e.t!=="moi"||vue!=="m2"){arreterMusique();return} if(!sonOn)return;
    const vite=e.r<10000, t=c.currentTime+0.02;
    note(c,motif[k%8]*(vite?1.5:1),t,0.22,0.07);
    if(k%2===0)note(c,basse[(k/2|0)%4],t,0.35,0.09,"sine");
    if(vite&&k%2===0)note(c,1760,t,0.05,0.04,"square");
    k++},250)}
function arreterMusique(){if(baroneMus){clearInterval(baroneMus);baroneMus=null}}
function gong(){if(!sonOn)return;const c=audioCtx();if(!c)return;const t=c.currentTime+0.02;
  [[110,0.5,4.5],[220,0.25,3.5],[277,0.14,3],[331,0.12,2.6],[440,0.08,2],[523,0.05,1.6]].forEach(([f,v,d])=>note(c,f,t,d,v,"sine"));
  note(c,55,t,3,0.3,"sine")}
function majBarone(){const e=etatBarone();
  if(e.t==="moi"){if(!baroneEtaitMoi){baroneEtaitMoi=true;demarrerMusique()}}
  else if(baroneEtaitMoi){baroneEtaitMoi=false;arreterMusique();gong();feter("Rendez le Barone !","Le temps est écoulé : reposez-le sur la table pour l'autre équipe");setTimeout(gong,1600)}

function csvTexte(sep){const h=["Equipe","Mascotte","Adversaire","Duel","Planche","Date","Manche 1","Manche 2","Image mystere","Total","Max","Resultat","Note /20","Titres"];
  const rows=[...resultats].sort((a,b)=>String(a.date).localeCompare(String(b.date)));

function noteA1(gid){if(gid==="TEST"){const e=evals.find(x=>x.evaluateur==="TEST"&&x.statut==="envoyee");return e?+e.total:null}const a=a1docs[gid];if(a&&a.noteProf!=null&&a.noteProf!=="")return +a.noteProf;
  const ev=evals.filter(e=>e.cible===gid&&e.statut==="envoyee");if(!ev.length)return null;
  return Math.max(...ev.map(e=>+e.total||0))}
function etatAt(g,id){
  if(!atelierActif(id))return {st:"off"};
  if(id==="a1"){const a=a1docs[g.id]||{}, mes=evals.filter(e=>e.evaluateur===g.id), pend=mes.filter(e=>e.statut!=="envoyee");
    if(!a.maquette)return {st:a.debut?"encours":"afaire"};
    if(!mes.some(e=>e.statut==="envoyee")||pend.length)return {st:"encours",evalAFaire:true,pend:pend[0]};
    return {st:"fait",note:noteA1(g.id)}}
  if(id==="a2"&&g.id==="TEST")return testE&&testE.a2!=null?{st:"fait",note:testE.a2}:{st:"afaire"};
  if(id==="a2"){const r=resultats.find(r=>r.groupe===g.id);if(r)return {st:"fait",note:+r.note};
    if(duelsEnCours.some(d=>d.groupeA===g.id||d.groupeB===g.id))return {st:"encours"};return {st:"afaire"}}
  return {st:"off"}}
function bilan(g){const dispo=ATELIERS.filter(a=>atelierActif(a.id)), et=dispo.map(a=>[a,etatAt(g,a.id)]);
  const faits=et.filter(([,e])=>e.st==="fait").length, tout=dispo.length>0&&faits===dispo.length;
  const notes=et.map(([,e])=>e.note), complet=tout&&notes.every(n=>n!=null);
  const finale=complet?Math.round(notes.reduce((s,n)=>s+n,0)/notes.length*10)/10:null;
  return {dispo,et,faits,tout,complet,finale}}

function lireListe(txt){
  const lignes=txt.split(/\r?\n/).map(l=>l.replace(/\[.*?\]\(.*?\)/g,"").replace(/\S+@\S+/g,"").trim()).filter(Boolean);
  const maj=w=>/^[A-ZÀ-ÖØ-Ý][A-ZÀ-ÖØ-Ý'’\-]+$/.test(w);
  const out=[];let prenom=null;
  for(const l of lignes){const w=l.split(/\s+/);
    if(w.every(maj)){if(prenom){out.push({p:prenom,n:l});prenom=null}continue}
    const iN=w.findIndex(maj);
    if(iN>0&&w.slice(iN).every(maj)){out.push({p:w.slice(0,iN).join(" "),n:w.slice(iN).join(" ")});prenom=null;continue}
    if(iN===0){const iP=w.findIndex(x=>!maj(x));out.push({p:w.slice(iP).join(" "),n:w.slice(0,iP).join(" ")});prenom=null;continue}
    prenom=l}
  const norm=x=>x.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-");
  const vus=new Set();return out.map(e=>{let id=norm(e.p+"-"+e.n),k=2;while(vus.has(id))id=norm(e.p+"-"+e.n)+"-"+k++;vus.add(id);return Object.assign({id},e)})}

const tirageManuel=s=>!!s&&s.manuel!==false;
function debutSeance(s){if(!s)return null;if(tirageManuel(s))return s.tirageDemande||null;const t=Date.parse(s.debut||(s.date+"T08:10"));return isNaN(t)?null:t}

const CHANGEMENT_MIN=2;
function rotSuivanteDoc(r){const now=Date.now();if(r===PAUSE_APRES&&r<NB_ROT){const e=now+PAUSE_MIN*60e3;return {r,t:e,pauseJusqu:e}}
  if(r>0&&r<NB_ROT){const e=now+CHANGEMENT_MIN*60e3;return {r,t:e,pauseJusqu:e,changement:true}}return {r,t:now}}
function phaseSeance(sid){const s=seances[sid],d=deroules[sid],H0=debutSeance(s);
  if(d&&d.r>=NB_ROT)return {phase:"fin"};
  /* pause décidée par un encadrant : la rotation d.r démarre à la fin de la pause */
  if(d&&d.pauseJusqu&&Date.now()<d.pauseJusqu)return {phase:"pause",r:d.r,reste:d.pauseJusqu-Date.now(),prets:{}};
  const prets={};groupesDe(sid).forEach(g=>{if(d&&(g.pret===d.r||(d.r>=0&&d.r<NB_ROT&&groupeAFini(g,atelierDe(g.k,d.r).id))))prets[g.id]=1});
  if(d&&d.r>=0){const R=dureeRot(s);let r=d.r,t=d.t;
    /* si le changement d'atelier n'a pas pu être enregistré (base indisponible), on avance à l'heure prévue, au bout de 1 min de dépassement */
    while(r<NB_ROT&&Date.now()-t>=R+60e3){t+=R;r++}

    if(r!==d.r){const p2={};groupesDe(sid).forEach(g=>{if(g.pret===r)p2[g.id]=1});return {phase:"rot",r,reste:Math.max(0,R-(Date.now()-t)),prets:p2}}

  const cand=Object.keys(a1docs).filter(id=>id.startsWith(t.seance+"-G")&&!id.startsWith(t.groupe+"-")&&a1docs[id].maquette&&!evals.some(e=>e.cible===id)&&!evals.some(e=>e.evaluateur===id&&e.cible===t.id));
  if(!cand.length){const fin=phaseSeance(t.seance).phase==="fin";
    modale(fin?"Plus aucune maquette à évaluer":"Pas encore de maquette à évaluer",fin?"Toutes les maquettes ont déjà un évaluateur.":"Aucune maquette d'un groupe précédent n'attend d'évaluation : vous êtes sans doute le premier groupe de cet atelier. <b>Votre évaluation se fera à la fin de la séance</b> (un bandeau vous préviendra). Elle compte dans votre note.","Compris",()=>{ctxEquipe=null;vue="hub";rendre()},"","Rester ici");return}

ATELIERS[5]={id:"a6",n:6,titre:"Pilote du rumen",sous:"Réglez la ration d'un troupeau et gardez le rumen en bonne santé : pH, AGV, méthane et lait",par:"Morgane Robles",ic:"etoile"};

/* ===== Pilote du rumen : modèle pédagogique (valeurs validées, livre INRA 2018 + articles) =====
   Vache laitière de 650 kg ingérant 22 kg de MS (niveau d'ingestion 3,4 % du poids vif). */
const A6_FOURRAGES={
  foin:{nom:"Foin long",ndf:600,long:1.0,p2:0.90,amidon:0},
  herbe:{nom:"Ensilage d'herbe haché",ndf:550,long:0.9,p2:0.75,amidon:0},
  mais:{nom:"Ensilage de maïs haché",ndf:420,long:0.85,p2:0.65,amidon:300},
  broye:{nom:"Fourrage broyé fin",ndf:600,long:0.4,p2:0.25,amidon:0}};
const A6_CEREALES={mais:{nom:"Maïs (amidon lent)",deg:0.60,ndf:150},ble:{nom:"Blé ou orge (amidon rapide)",deg:0.85,ndf:180}};
const A6_DISTRIB={d2:{nom:"2 repas de concentré",amp:1.0,repas:[6,16]},d4:{nom:"4 repas de concentré",amp:0.6,repas:[6,11,16,21]},rc:{nom:"Ration complète mélangée",amp:0.5,repas:[8,17]}};
const MSI=22, PV=650;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function a6Crit(v,seuils,croissant){/* note IRA d'un critère : 0 pas de risque, 1 faible, 2 fort */
  const [a,b]=seuils; if(croissant)return v<=a?0:v<=b?1:2; return v>=b?0:v>=a?1:2}
function a6Simuler(r){
  const P=r.conc/100, F=A6_FOURRAGES[r.fourrage], C=A6_CEREALES[r.cereale], D=A6_DISTRIB[r.distrib];
  const NDFfo=(1-P)*F.ndf*F.long;                         /* NDF du fourrage long, g/kg MS */
  const NDF=(1-P)*F.ndf+P*C.ndf;                          /* NDF total, g/kg MS */
  const AmiD=P*600*C.deg+(1-P)*F.amidon*0.75;            /* amidon dégradé dans le rumen, g/kg MS */
  const P2=100*((1-P)*F.p2+P*0.05);                       /* particules > 2 mm, % MS */
  const BE=220+(r.tampon?108:0);                          /* bilan électrolytique, mEq/kg MS (200 g de bicarbonate = +108) */
  /* pH moyen : équations INRA 15.3 (NDF du fourrage long) et 15.4 (amidon dégradable), combinées autour de 6,4 */
  const pHfo=5.64+0.0025*NDFfo-0.0000017*NDFfo*NDFfo, pHam=6.40-0.001*AmiD;
  let pHm=6.4+(pHfo-6.4)+0.7*(pHam-6.4)+(r.tampon?0.07:0);
  pHm=clamp(pHm,5.3,6.8);
  /* indice de risque d'acidose (figure 15.5) */
  const crits=[
    {nom:"Concentré",v:r.conc,u:"% MS",n:a6Crit(r.conc,[40,50],true)},
    {nom:"Amidon dégradable",v:AmiD,u:"g/kg MS",n:a6Crit(AmiD,[200,250],true)},
    {nom:"Particules > 2 mm",v:P2,u:"% MS",n:a6Crit(P2,[45,50],false)},
    {nom:"NDF du fourrage long",v:NDFfo,u:"g/kg MS",n:a6Crit(NDFfo,[250,300],false)},
    {nom:"NDF total",v:NDF,u:"g/kg MS",n:a6Crit(NDF,[300,350],false)},
    {nom:"Bilan électrolytique",v:BE,u:"mEq/kg MS",n:a6Crit(BE,[200,250],false)}];
  const IRA=crits.reduce((s,c)=>s+c.n,0)/crits.length;
  /* courbe sur 24 h : creux 3 à 4 h après chaque repas, plus profond avec peu de repas et beaucoup de concentré */
  const A=(0.25+0.9*P)*D.amp, h=[];
  const creux=t=>{const x=t/3.5;return x<=0?0:x*Math.exp(1-x)};
  for(let t=0;t<24;t+=0.5){let d=0;D.repas.forEach(m=>{d+=creux(((t-m)+24)%24)});h.push(d)}
  const moy=h.reduce((s,x)=>s+x,0)/h.length, pk=Math.max(...h)-moy;
  const courbe=h.map(x=>clamp(pHm-A*(x-moy)/(pk||1)*0.85,4.9,7.1));

let famEtat=null, famId=null, famMoi=null, famUnsub=[], famVote=null, famVuEvt=-1, famDemande=null, famZoom=null, famPres={}, famBotT=null, famTick=null;

async function ouvrirFamilles(){const g=monGroupe();if(!g)return;const t=monEquipe(g,"a3");if(!t){toast("Formez d'abord les duos");return}
  famMoi=t.id;famVuEvt=-1;famDemande=null;famZoom=null;famUnsub.forEach(u=>u());famUnsub=[];
  const duos=duosA3(g).map(d=>({id:d.id,nom:d.nom}));
  if(g.id==="TEST"){famId="TEST-fam";const ds=[{id:t.id,nom:"Votre duo"},...FAM_TEST_DUOS.map((n,i)=>({id:"BOT"+(i+1),nom:n+" (fictif)"}))];
    famEtat={id:famId,test:true,statut:"attente",duos:ds,ordre:ds.map(d=>d.id),mains:{},poses:{},pioche:[],tour:null,evt:{n:0},journal:[],duree:15*60e3};famPres={};ds.forEach(d=>famPres[d.id]=1);vue="fam";rendre();return}
  if(!db){toast("Pas de connexion au serveur");return}
  const p=phaseSeance(g.seance);famId=(g.id+"-fam-R"+(p.r!=null?p.r:0)).replace(/[^A-Za-z0-9-]/g,"");
  const ref=db.collection("familles").doc(famId);let sn=null;try{sn=await ref.get()}catch(e){}
  if(!sn||!sn.exists){let L={acquired:true};try{L=await db.collection("config").doc("lock-"+famId).acquire({holder:DEVICE,ttlMs:6000})}catch(e){}
    if(L.acquired){try{sn=await ref.get()}catch(e){}if(!sn||!sn.exists){const d={groupe:g.id,seance:g.seance,statut:"attente",duos,ordre:[],mains:{},poses:{},pioche:[],tour:null,evt:{n:0},journal:[],duree:famDuree(g),cree:Date.now()};famEtat=d;await ref.set(d)}}
    else await new Promise(r=>setTimeout(r,1200))}
  db.collection("famj").doc(famId+"-"+famMoi).set({jeu:famId,duo:famMoi,t:Date.now()}).catch(()=>{});
  famUnsub.push(ref.onSnapshot(s=>{if(!s.exists)return;famEtat=Object.assign({id:famId},s.data());setTimeout(famRejoindreEnCours,0);famMaj()},()=>{}));
  famUnsub.push(db.collection("famj").where("jeu","==",famId).onSnapshot(s=>{famPres={};s.docs.forEach(d=>famPres[d.data().duo]=1);if(famEtat&&famEtat.statut==="attente")famMaj()},()=>{}));
  setTimeout(famRejoindreEnCours,1500);setTimeout(famRejoindreEnCours,5000);
  famUnsub.push(db.collection("famvote").doc(famId).onSnapshot(s=>{famVote=s.exists?s.data():null;famAppliquerVote()},()=>{}));
  vue="fam";rendre();window.scrollTo(0,0)}
function famQuitter(){v3dDetruire();famUnsub.forEach(u=>u());famUnsub=[];clearTimeout(famBotT);famEtat=null;famId=null;vue="a3";rendre();window.scrollTo(0,0)}
async function famEcrire(){if(!famEtat)return;famEtat.maj=Date.now();if(famEtat.test){famMaj();famBots();return}
  const d=JSON.parse(JSON.stringify(famEtat));delete d.id;try{await db.collection("familles").doc(famId).set(d)}catch(e){ecrire("familles",famId,d)}famMaj()}
function famMaj(){if(famEtat&&famEtat.statut==="en_cours")v3dPrep();if(famEtat&&famEtat.statut==="fin")v3dFermer();if(vue!=="fam")return;const y=window.scrollY;rendre();window.scrollTo(0,y);famAnimer()}

/* ----- règles du jeu ----- */
const melange=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const famNb=(main,f)=>main.filter(c=>CARTES7[c].f===f).length;
const famCompletes=main=>FAMILLES.filter(f=>famNb(main,f.id)===6).map(f=>f.id);
function famEvt(o,log){famEtat.evt=Object.assign({n:(famEtat.evt.n||0)+1,t:Date.now()},o);if(log){famEtat.journal=[log,...(famEtat.journal||[])].slice(0,8)}}
/* un duo arrivé après le début de la partie la rejoint : il reçoit 6 cartes de la pioche et joue après les autres */
let famRejoint=null;
function famDistribuerRetard(E,id){if(!E||E.statut!=="en_cours"||!id||(E.ordre||[]).includes(id))return false;if(!(E.duos||[]).some(d=>d.id===id))return false;
  E.pioche=E.pioche||[];E.mains=E.mains||{};E.poses=E.poses||{};E.mains[id]=E.pioche.splice(0,Math.min(6,E.pioche.length));E.poses[id]=E.poses[id]||[];E.ordre=[...E.ordre,id];return true}
async function famRejoindreEnCours(){const E=famEtat;if(!E||E.test||E.statut!=="en_cours"||!famMoi||(E.ordre||[]).includes(famMoi)||famRejoint===famId+famMoi)return;
  famRejoint=famId+famMoi;let L={acquired:true};try{L=await db.collection("config").doc("famjoin-"+famId).acquire({holder:DEVICE,ttlMs:5000})}catch(e){}
  if(!L.acquired){setTimeout(()=>{famRejoint=null;famRejoindreEnCours()},1500);return}
  try{const sn=await db.collection("familles").doc(famId).get();if(sn&&sn.exists)famEtat=Object.assign({id:famId},sn.data())}catch(e){}
  if(famDistribuerRetard(famEtat,famMoi)){famEvt({type:"arrivee"},famNomDuo(famMoi)+" rejoint la partie avec "+famEtat.mains[famMoi].length+" cartes.");await famEcrire();toast("Vous rejoignez la partie en cours : voici vos cartes")}}
function famCommencer(){const E=famEtat;E.duree=E.duree||15*60e3;E.ordre=E.test?E.duos.map(d=>d.id):E.duos.map(d=>d.id).filter(id=>famPres[id]);
  if(E.ordre.length<2){toast("Il faut au moins 2 duos connectés");return}
  const p=melange(Object.keys(CARTES7));E.mains={};E.poses={};E.ordre.forEach(id=>{E.mains[id]=p.splice(0,6);E.poses[id]=[]});E.pioche=p;
  E.tour=E.ordre[Math.floor(Math.random()*E.ordre.length)];E.statut="en_cours";E.debut=Date.now();E.enValidation=null;
  famEvt({type:"debut"},"La partie commence : "+famNomDuo(E.tour)+" ouvre le jeu.");famEcrire()}
function famSuivant(){const E=famEtat;let i=E.ordre.indexOf(E.tour);for(let k=0;k<E.ordre.length;k++){i=(i+1)%E.ordre.length;const id=E.ordre[i];if(E.mains[id].length||E.pioche.length){E.tour=id;return true}}
  famFin();return false}
function famFin(){const E=famEtat;if(E.statut==="fin")return;E.statut="fin";E.fin=Date.now();famEvt({type:"fin"},"Fin de la partie.")}
function famVerifFin(){const E=famEtat;const poses=Object.values(E.poses).reduce((s,x)=>s+x.length,0);
  if(poses===7||(!E.pioche.length&&Object.values(E.mains).every(m=>!m.length))||Date.now()-E.debut>=E.duree){famFin();return true}return false}
function famCriteres(cid){const c=CARTES7[cid],f=famDe(c.f);
  const autres=FAMILLES.filter(x=>x.id!==c.f&&(f.id==="vaisseaux"?false:x.id!=="vaisseaux")).map(x=>x.cartes[c.i][0]).flat();
  const pool=f.id==="vaisseaux"?f.cartes.filter((_,i)=>i!==c.i).map(x=>x[0]).flat():autres;
  const faux=melange(pool.filter(p=>!c.puces.includes(p))).slice(0,2);return melange([c.puces[Math.floor(Math.random()*c.puces.length)],...faux])}
function famDemander(cible,cid,critere){const E=famEtat,me=E.tour,c=CARTES7[cid],f=famDe(c.f);
  const quoi=`${f.nom} : ${c.membre.toLowerCase()}`;
  if(!c.puces.includes(critere)){famStat("c",f.id,0);famEtat.fx=[...(famEtat.fx||[]),[cid,critere]].slice(-40);famEvt({type:"critere",de:me,a:cible,carte:cid,critere},`${famNomDuo(me)} demande « ${quoi} » à ${famNomDuo(cible)}, mais le critère est faux : tour passé.`);famSuivant();famEcrire();return}
  famStat("c",f.id,1);const i=E.mains[cible].indexOf(cid);
  if(i>=0){E.mains[cible].splice(i,1);E.mains[me].push(cid);famEvt({type:"donne",de:cible,a:me,carte:cid},`${famNomDuo(cible)} donne « ${quoi} » à ${famNomDuo(me)}, qui rejoue.`);if(!famVerifFin()){}famEcrire();return}
  if(!E.pioche.length){famEvt({type:"pioche_vide",de:cible,a:me,carte:cid},`${famNomDuo(cible)} n'a pas « ${quoi} ». Pioche vide : au suivant.`);famSuivant();famVerifFin();famEcrire();return}
  const pc=E.pioche.shift();E.mains[me].push(pc);
  if(pc===cid){famEvt({type:"pioche_bonne",de:cible,a:me,carte:cid},`« Pioche ! » … et ${famNomDuo(me)} pioche justement « ${quoi} » : il rejoue !`)}
  else{famEvt({type:"pioche",de:cible,a:me,carte:pc,voulue:cid},`${famNomDuo(cible)} n'a pas « ${quoi} » : « Pioche ! »`);famSuivant()}
  famVerifFin();famEcrire()}
function famPiocherMainVide(){const E=famEtat;if(!E.pioche.length)return;const pc=E.pioche.shift();E.mains[E.tour].push(pc);famEvt({type:"pioche_seule",a:E.tour,carte:pc},`${famNomDuo(E.tour)} avait la main vide : il pioche une carte.`);famEcrire()}
function famPoser(fid){const E=famEtat;E.enValidation={duo:E.tour,fam:fid,n:(E.evt.n||0)+1};famEvt({type:"validation",a:E.tour,fam:fid},`${famNomDuo(E.tour)} pose la famille ${famDe(fid).nom} : validation sur le modèle 3D.`);
  if(!E.test)db.collection("famvote").doc(famId).delete().catch(()=>{});famEcrire();if(E.tour===famMoi)v3dOuvrir(fid,E.enValidation.n)}
/* Calque plein écran avec l'application 3D (atelier3/index.html?embed=1), préchargé pendant la partie */
let v3d=null;
function v3dPrep(){if(v3d||!famMoi)return;const g=monGroupe();const nom=(famEtat&&famEtat.duos||[]).find(d=>d.id===famMoi);
  const el=document.createElement("div");el.id="v3d";el.className="charge";
  el.innerHTML=`<div class="v3dbar"><span class="tag" style="background:#1d1d1b;color:#fff">VALIDATION</span><b id="v3dTitre">Modèle 3D</b></div><div class="v3dload"><p>Chargement des modèles 3D…</p></div>`;
  const f=document.createElement("iframe");f.title="Validation de la famille sur le modèle 3D";f.allow="fullscreen";
  f.src="atelier3/index.html?embed=1&duo="+encodeURIComponent(famMoi)+"&duos="+encodeURIComponent(JSON.stringify([{id:famMoi,nom:nom?nom.nom:"Votre duo"}]));

function v3dOuvrir(fam,n){v3dPrep();if(!v3d)return;v3d.attente={fam,n};const t=document.getElementById("v3dTitre");if(t)t.textContent="Famille "+famDe(fam).nom+" : 2 structures à toucher";
  v3d.el.classList.add("on");if(v3d.pret)v3dEnvoyer()}
function v3dEnvoyer(){if(!v3d||!v3d.attente)return;try{v3d.f.contentWindow.postMessage({tp3:"valider",fam:v3d.attente.fam,n:v3d.attente.n},"*");v3d.f.contentWindow.postMessage({tp3:"afficher"},"*")}catch(e){}}
function v3dFermer(){if(v3d){v3d.el.classList.remove("on");v3d.attente=null}}
function v3dDetruire(){if(v3d){v3d.el.remove();v3d=null}}
window.addEventListener("message",ev=>{if(!v3d||ev.source!==v3d.f.contentWindow)return;const d=ev.data||{};
  if(d.tp3==="pret"){v3d.pret=true;v3d.el.classList.remove("charge");v3dEnvoyer();return}
  if(d.tp3==="resultat"){const E=famEtat;v3dFermer();if(!E||!E.enValidation||E.enValidation.duo!==famMoi||E.enValidation.fam!==d.fam)return;
    famVote={n:E.enValidation.n,ok:!!d.ok,par:famMoi,t:Date.now()};famAppliquerVote()}});
function famAppliquerVote(){const E=famEtat;if(!E||!E.enValidation||!famVote||famVote.n!==E.enValidation.n)return;if(E.tour!==famMoi&&!E.test)return;
  const {duo,fam}=E.enValidation;E.enValidation=null;const f=famDe(fam);famStat("v",fam,famVote.ok);
  if(famVote.ok){E.mains[duo]=E.mains[duo].filter(c=>CARTES7[c].f!==fam);E.poses[duo].push(fam);famEvt({type:"validee",a:duo,fam},`Famille ${f.nom} validée sur le modèle 3D : ${famNomDuo(duo)} devient « ${TITRE7[fam]||f.nom} » !`);
    if(!famVerifFin()&&!E.mains[duo].length&&!E.pioche.length)famSuivant()}
  else{const cs=E.mains[duo].filter(c=>CARTES7[c].f===fam);E.mains[duo]=E.mains[duo].filter(c=>CARTES7[c].f!==fam);E.pioche=melange([...E.pioche,...cs]);famEvt({type:"refusee",a:duo,fam},`Famille ${f.nom} non validée sur le modèle 3D : ses cartes retournent dans la pioche.`);famSuivant()}
  famVote=null;famEcrire()}

  const nat=FORMAT_NATUREL(),c=FORMAT===nat?"width=device-width,initial-scale=1,viewport-fit=cover":FORMAT==="tel"?"width=560,viewport-fit=cover":"width=1000,viewport-fit=cover";

/* =========================================================
   SÛRETÉ DES NOTES
   1. Journal local de chaque note écrite (jamais effacé) + renvoi automatique jusqu'à confirmation du serveur
   2. Copie « historique » de chaque note (collection journal_notes, jamais écrasée)
   3. Archive complète des notes de la séance sur chaque téléphone et sur le serveur
   4. Notes de repli quand un atelier n'a pas pu être fini (temps écoulé, maquette jamais évaluée)
   5. Code de secours (texte + QR) par étudiant, importable par les encadrants
   6. Note manuelle des encadrants en dernier recours
   ========================================================= */
const COLS_NOTES=["resultats","a1eval","notes_a3","notes_a5","a4","a6","a1"];
let journalNotes=LS.get("journalNotes",[]), secoursDocs={}, notesManu={};
async function ecrire(col,id,data,mode){
  const test=(testE&&String(id).startsWith("TEST"))||String(id).startsWith("TEST");
  if(test||!COLS_NOTES.includes(col))return ecrireBase(col,id,data,mode);
  const k=col+"/"+id, e={k,col,id,data:JSON.parse(JSON.stringify(data)),mode:mode||"set",t:Date.now(),ok:false};
  const prec=journalNotes.find(x=>x.k===k&&!x.ok);if(prec&&e.mode==="update"){e.data=Object.assign({},prec.data,e.data);e.mode=prec.mode}
  journalNotes=journalNotes.filter(x=>x.k!==k);journalNotes.push(e);
  if(journalNotes.length>400)journalNotes=journalNotes.filter(x=>!x.ok).concat(journalNotes.filter(x=>x.ok).slice(-200));
  LS.set("journalNotes",journalNotes);
  ecrireBase("journal_notes",(col+"~"+id+"~"+e.t+"~"+DEVICE).replace(/[\/]/g,"_"),{col,doc:id,data:e.data,mode:e.mode,t:e.t,appareil:DEVICE,eid:moiE&&moiE.eid||""});
  const ok=await ecrireBase(col,id,data,mode);
  if(ok){e.ok=true;LS.set("journalNotes",journalNotes)}
  majSurete();return ok}
async function verifierJournal(){if(!db)return;const att=journalNotes.filter(x=>!x.ok);if(!att.length)return;
  for(const e of att){try{
    const s=await avecDelai(db.collection(e.col).doc(e.id).get(),8000);const srv=s&&s.exists?s.data():null;
    const deja=srv&&Object.keys(e.data).every(k=>JSON.stringify(srv[k])===JSON.stringify(e.data[k]));
    const plusRecent=srv&&srv.maj&&e.data.maj&&srv.maj>e.data.maj;
    if(!deja&&!plusRecent){if(e.mode==="update"&&!srv)await avecDelai(db.collection(e.col).doc(e.id).set(e.data),9000);else await avecDelai(db.collection(e.col).doc(e.id)[e.mode](e.data),9000)}
    e.ok=true}catch(err){}}
  LS.set("journalNotes",journalNotes);majSurete()}
setInterval(verifierJournal,20000);window.addEventListener("online",()=>setTimeout(verifierJournal,1500));

  const sd=subsDe(g.id,aid),i=sd?sd.equipes.findIndex(e=>e.includes(eid)):-1,tid=i>=0?g.id+"-"+aid+"-e"+(i+1):null;
  if(tid&&aid==="a6"&&atelierPasse(g,"a6")){const v=a6NoteGroupe(g,true);if(v!=null)return {v,src:"repli"}}
  if(tid&&aid==="a4"&&atelierPasse(g,"a4")){const d=a4docs[tid];if(d&&(A4_PIECES.some(p=>d[p.id])||d.vuIntro))return {v:a4Note(Object.assign({},d,{fini:true})),src:"repli"}}
  if(tid&&aid==="a3"&&atelierPasse(g,"a3")){const pr=a3prog[tid];if(pr){const parts=[pr.reperage,pr.quiz].filter(x=>x&&x.total);if(parts.length)return {v:Math.round(parts.reduce((s,x)=>s+x.score/x.total,0)/parts.length*20*2)/2,src:"repli"}}}
  if(tid&&aid==="a1"&&phaseSeance(g.seance).phase==="fin"&&(a1docs[tid]||{}).maquette){
    const autres=[...new Set(evals.filter(e=>e.statut==="envoyee"&&e.seance===g.seance&&e.cible!==tid).map(e=>e.cible))].map(x=>noteA1(x)).filter(x=>x!=null);
    if(autres.length){const m=autres.reduce((s,x)=>s+x,0)/autres.length;const fait=evals.some(e=>e.evaluateur===tid&&e.statut==="envoyee");return {v:Math.round((m/20*16+(fait?4:0))*2)/2,src:"repli"}}}
  const sc=secoursDocs[g.seance+"~"+eid];if(sc&&sc.n&&sc.n[aid]!=null)return {v:+sc.n[aid],src:"secours"};

/* ----- code de secours ----- */
const SEL_SECOURS=()=>"tpdig|"+PIN;
function hachage(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36).slice(-4).toUpperCase().padStart(4,"0")}
const NOTE_C=v=>v==null?"x":String(Math.round(v*2));
function codeSecours(g,eid){const n=noteEtudiant(g,eid).par;const corps=[g.seance,eid,...ATELIERS_APP().map(a=>a.id.slice(1)+NOTE_C(n[a.id]))].join("~");return corps+"~"+hachage(corps+SEL_SECOURS())}
function lireCodeSecours(code){code=String(code||"").trim();if(code.includes("secours="))code=decodeURIComponent(code.split("secours=")[1].split("&")[0]);
  const p=code.split("~");if(p.length<4)return null;const chk=p.pop(),corps=p.join("~");if(hachage(corps+SEL_SECOURS())!==chk.toUpperCase())return {erreur:"code abîmé ou modifié"};
  const [s,e,...ns]=p,n={};ns.forEach(x=>{const a="a"+x[0],v=x.slice(1);if(v!=="x")n[a]=+v/2});return {s,e,n}}

function blocSurete(g,b){if(!g||g.id==="TEST"||!moiE)return "";const p=phaseSeance(g.seance);const aDesNotes=Object.values(b.moi.par).some(x=>x!=null);

let abos=[], aboCle="", a3prog={};
function portee(){if(vue==="prof"){let ps="";try{ps=profSeance||seanceSel||(typeof seanceParDefaut==="function"?seanceParDefaut():"")||""}catch(e){}return "prof:"+(ps||"")}if(moiE&&monGid!=="TEST"){const g=monGroupeDe();return "etu:"+moiE.sid+":"+(g?g.id:"")}return "acc:"+(seanceSel||"")}
function upsert(arr,id,data){const i=arr.findIndex(x=>x.id===id);if(data==null){if(i>=0)arr.splice(i,1);return}const o=Object.assign({id},data);if(i>=0)arr[i]=o;else arr.push(o)}
function reabonner(){if(!db)return;const c=portee();if(c===aboCle)return;aboCle=c;abos.forEach(u=>{try{u&&u()}catch(e){}});abos=[];
  const S=(q,f)=>{try{abos.push(q.onSnapshot(f,()=>{}))}catch(e){}};
  const coll=(nom,f)=>s=>{f(s.docs);rendrePortail()};
  if(c.startsWith("prof:")){const ps=c.slice(5);
    /* lecture limitée à la séance affichée (quota gratuit Firestore) ; sans séance connue : tout */
    const Q=n=>ps?db.collection(n).where("__id__",">=",ps).where("__id__","<",ps+"\uf8ff"):db.collection(n);
    const W=n=>ps?db.collection(n).where("seance","==",ps):db.collection(n);
    S(Q("groupes"),coll("groupes",d=>{groupes=d.map(x=>Object.assign({id:x.id},x.data()))}));
    S(W("bandes"),coll("bandes",d=>{bandes=d.map(x=>Object.assign({id:x.id},x.data()))}));
    S(Q("deroule"),coll("deroule",d=>{deroules={};d.forEach(x=>deroules[x.id]=x.data())}));
    S(Q("subs"),coll("subs",d=>{subsDocs={};d.forEach(x=>subsDocs[x.id]=x.data())}));
    S(Q("a1"),coll("a1",d=>{a1docs={};d.forEach(x=>a1docs[x.id]=x.data());if(testE)Object.assign(a1docs,testE.a1)}));
    S(W("a1eval"),coll("a1eval",d=>{evals=d.map(x=>Object.assign({id:x.id},x.data()));if(testE)evals=evals.concat(testE.evals)}));
    S(Q("a4"),coll("a4",d=>{a4docs={};d.forEach(x=>a4docs[x.id]=x.data())}));
    S(Q("a6"),coll("a6",d=>{a6docs={};d.forEach(x=>a6docs[x.id]=x.data())}));
    S(Q("notes_a3"),coll("notes_a3",d=>{notesA3=d.map(x=>Object.assign({id:x.id},x.data()))}));
    S(Q("a3prog"),coll("a3prog",d=>{a3prog={};d.forEach(x=>a3prog[x.id]=x.data())}));
    S(Q("notes_a5"),coll("notes_a5",d=>{notesA5=d.map(x=>Object.assign({id:x.id},x.data()))}));
    S(W("resultats"),coll("resultats",d=>{resultats=d.map(x=>Object.assign({},x.data()))}));
    S(Q("secours"),coll("secours",d=>{secoursDocs={};d.forEach(x=>secoursDocs[x.id]=x.data())}));
    S(Q("notes_manuelles"),coll("nm",d=>{notesManu={};d.forEach(x=>notesManu[x.id]=x.data())}));

    return}
  if(c.startsWith("acc:")){const sid=c.slice(4);if(!sid)return;

  if(!c.startsWith("etu"))return;
  const [,sid,gid]=c.split(":");

  if(moiE)S(db.collection("profils").doc((moiE.sid+"~"+moiE.eid).replace(/[\/]/g,"_")),s=>{if(s.exists){pfProfil=s.data();LS.set("monAvatar_"+pfCle(),pfProfil);rendrePortail()}});
  S(db.collection("a1eval").where("seance","==",sid),coll("a1eval",d=>{evals=d.map(x=>Object.assign({id:x.id},x.data()))}));
  S(db.collection("resultats").where("seance","==",sid),coll("resultats",d=>{resultats=d.map(x=>Object.assign({},x.data()))}));
  if(!gid){S(db.collection("bandes").where("seance","==",sid),coll("bandes",d=>{bandes=d.map(x=>Object.assign({id:x.id},x.data()))}));return}
  S(db.collection("subs").where("groupe","==",gid),coll("subs",d=>{d.forEach(x=>subsDocs[x.id]=x.data())}));
  const docs=(col,n,f)=>{for(let i=1;i<=n;i++){const id=gid+"-"+col.a+"-e"+i;S(db.collection(col.c).doc(id),s=>{f(id,s.exists?s.data():null);rendrePortail()})}};
  docs({c:"a1",a:"a1"},3,(id,d)=>{if(d)a1docs[id]=d;else delete a1docs[id]});
  docs({c:"a4",a:"a4"},3,(id,d)=>{if(d)a4docs[id]=d;else delete a4docs[id]});
  docs({c:"a6",a:"a6"},3,(id,d)=>{if(d)a6docs[id]=d;else delete a6docs[id]});
  docs({c:"notes_a3",a:"a3"},6,(id,d)=>upsert(notesA3,id,d));
  docs({c:"a3prog",a:"a3"},6,(id,d)=>{if(d)a3prog[id]=d;else delete a3prog[id]});
  docs({c:"notes_a5",a:"a5"},6,(id,d)=>upsert(notesA5,id,d));
  /* les bandes ne servent plus une fois les groupes formés : une seule lecture pour l'affichage */
  db.collection("bandes").where("seance","==",sid).get().then(s=>{bandes=s.docs.map(x=>Object.assign({id:x.id},x.data()))}).catch(()=>{})}

/* ----- prénoms masculins (le reste est compté comme féminin, sauf prénoms mixtes) : sert seulement à mélanger ----- */
const PRENOMS_M=new Set("adrien augustin bastien emmeran esteban etienne felix florent leonard loann louis marius paul-jean thibault victor hugo lucas theo thomas nathan maxime antoine alexandre arthur jules paul pierre nicolas julien baptiste mathis tom raphael gabriel leo enzo clement romain benjamin quentin valentin simon martin hugues vincent axel noah ethan sacha".split(" "));

const sansAccent=t=>String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
function sexe(sid,eid){const s=seances[sid];const e=s&&s.etudiants.find(x=>x.id===eid);if(!e)return "x";const p=sansAccent(e.p);
  if(PRENOMS_MIXTES.has(p))return "x";if(PRENOMS_M.has(p)||PRENOMS_M.has(p.split("-")[0]))return "m";return "f"}
/* mélange : filles et garçons alternés au hasard, puis distribués à tour de rôle */
function ordreMixte(sid,ids){const F=shuffle(ids.filter(e=>sexe(sid,e)==="f")),M=shuffle(ids.filter(e=>sexe(sid,e)==="m")),X=shuffle(ids.filter(e=>sexe(sid,e)==="x"));
  const tous=[...F.map((e,i)=>[e,(i+.5)/F.length]),...M.map((e,i)=>[e,(i+.5)/M.length]),...X.map((e,i)=>[e,(i+.5)/X.length])];
  return tous.sort((a,b)=>a[1]-b[1]||Math.random()-.5).map(x=>x[0])}
function repartirEn(sid,ids,tailles){const out=tailles.map(()=>[]);const ordre=shuffle(tailles.map((_,i)=>i));
  /* chaque sexe est réparti à son tour : chaque personne va dans le groupe qui en compte le moins (puis le moins rempli) */
  for(const sx of ["m","x","f"]){for(const e of shuffle(ids.filter(x=>sexe(sid,x)===sx))){let best=-1,bv=null;
    for(const i of ordre){if(out[i].length>=tailles[i])continue;const v=[out[i].filter(x=>sexe(sid,x)===sx).length,out[i].length/tailles[i]];
      if(best<0||v[0]<bv[0]||(v[0]===bv[0]&&v[1]<bv[1])){best=i;bv=v}}
    if(best<0)best=out.reduce((bi,o,i)=>o.length<out[bi].length?i:bi,0);out[best].push(e)}}
  return out.map(o=>shuffle(o))}
function taillesEgales(N,G){return [...Array(G)].map((_,i)=>Math.floor(N/G)+(i<N%G?1:0))}
function sousGroupes(g,aid){const B=BESOIN[aid],m=g.membres||[],N=m.length;if(!N)return [];
  if(B.type==="equipes"){const n=N>=4?(B.n||2):1;return repartirEn(g.seance,m,taillesEgales(N,n))}
  /* duos : une fille et un garçon autant que possible ; trio si nombre impair */
  const nb=Math.max(1,Math.floor(N/2));const t=taillesEgales(N,nb);return repartirEn(g.seance,m,t)}
async function creerSousGroupes(g){for(const a of ATELIERS_APP()){const id=idSub(g.id,a.id);if(subsDocs[id])continue;const doc={groupe:g.id,aid:a.id,equipes:sousGroupes(g,a.id),t:Date.now(),auto:1};subsDocs[id]=doc;
  if(g.id==="TEST")continue;try{await db.collection("subs").doc(id).set(doc)}catch(e){ecrire("subs",id,doc)}}}

/* ----- formation des groupes : tirage au sort parmi les présents ----- */
async function assurerFormation(sid){if(!db||formEnCours||!sid)return;const p=phaseSeance(sid);if(p.phase!=="formation")return;
  formEnCours=true;
  try{const L=await db.collection("config").doc("form-"+sid).acquire({holder:DEVICE,ttlMs:15000});
    if(L.acquired&&!groupesDe(sid).length){const presents=[...new Set(bandes.filter(b=>b.seance===sid).flatMap(b=>b.membres))];const N=presents.length;
      if(N){const G=Math.max(1,Math.min(NB_ROT,Math.round(N/10)));const parts=repartirEn(sid,presents,taillesEgales(N,G));
        const gs=parts.map((m,i)=>({id:sid+"-G"+(i+1),seance:sid,k:i,nom:"Groupe "+(i+1),mascotte:MASCOTTES[i%MASCOTTES.length],couleur:COULEURS[i%COULEURS.length][1],membres:m,perso:false,cree:Date.now(),tirage:1}));
        for(const g of gs){groupes.push(g);await db.collection("groupes").doc(g.id).set(g)}
        for(const g of gs)await creerSousGroupes(g);
        deroules[sid]={r:-1,t:Date.now()};await db.collection("deroule").doc(sid).set(deroules[sid])}}}catch(e){}
  formEnCours=false}

/* duos : autant que possible une fille et un garçon */
function sousGroupes(g,aid){const B=BESOIN[aid],m=g.membres||[],N=m.length;if(!N)return [];
  if(B.type==="equipes"){const n=N>=4?(B.n||2):1;return repartirEn(g.seance,m,taillesEgales(N,n))}
  const F=shuffle(m.filter(e=>sexe(g.seance,e)==="f")),M=shuffle(m.filter(e=>sexe(g.seance,e)==="m")),X=shuffle(m.filter(e=>sexe(g.seance,e)==="x"));
  const duos=[];while(F.length&&M.length)duos.push([F.pop(),M.pop()]);
  const reste=shuffle([...F,...M,...X]);for(let i=0;i+1<reste.length;i+=2)duos.push([reste[i],reste[i+1]]);
  if(reste.length%2){const s=reste[reste.length-1];if(duos.length)duos[Math.floor(Math.random()*duos.length)].push(s);else duos.push([s])}
  return shuffle(duos)}

/* espace encadrants : chronomètre de la rotation en cours, visible dans tous les onglets, et où en est chaque atelier */

function bandeauTirage(){const sid=profSeance||seanceSel,s=seances[sid];if(!s||!tirageManuel(s))return "";const p=phaseSeance(sid);if(p.phase!=="inscription")return "";
  const n=new Set(bandes.filter(b=>b.seance===sid).flatMap(b=>b.membres)).size;
  return `<div class="card" style="border:3px solid var(--pen,#c62828);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between"><div><b style="font-size:20px">À faire : lancer le tirage au sort</b><p class="note" style="margin:4px 0 0">${esc(s.nom)} · <b>${n}</b> étudiant${n>1?"s":""} présent${n>1?"s":""} sur ${(s.etudiants||[]).length}. Lancez-le quand tout le monde a choisi son nom.</p></div><button class="btn pen gros" id="lancerTirageHaut" ${n?"":"disabled"}>Lancer le tirage</button></div>`}
document.addEventListener("click",e=>{if(e.target.closest&&e.target.closest("#lancerTirageHaut")){ongletProf="seance";rendre();setTimeout(()=>{const b=document.querySelector("#lancerTirage");if(b)b.click()},50)}});

/* commandes de secours de l'encadrant : +5 min, passer à l'atelier suivant */
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("#rotPlus5,#rotSuivante");if(!t||!db)return;const sid=profSeance||seanceSel,d=deroules[sid];if(!d)return;
  if(t.id==="rotPlus5"){if(Date.now()-(window.__plus5||0)<20000){toast("+5 min déjà ajoutées à l'instant");return}window.__plus5=Date.now();
    db.collection("deroule").doc(sid).get().then(x=>{const c=x&&x.exists?x.data():d;if(c.r!==d.r){toast("L'atelier vient de changer : rien n'a été ajouté");return}
      if(c.p5&&Date.now()-c.p5<30000){toast("Un autre encadrant vient d'ajouter 5 min : rien de plus n'a été ajouté");return}
      const nd={r:c.r,t:c.t+5*60e3,p5:Date.now()};deroules[sid]=nd;ecrire("deroule",sid,nd,"set");toast("5 minutes de plus pour tous les groupes");rendre()}).catch(()=>{const nd={r:d.r,t:d.t+5*60e3};deroules[sid]=nd;ecrire("deroule",sid,nd,"set");rendre()});return}
  modale(d.r<0?"Démarrer les ateliers ?":"Passer à l'atelier suivant ?",d.r<0?"Tous les groupes partent vers leur premier atelier.":"Tous les groupes changent d'atelier maintenant. Les notes déjà enregistrées sont gardées ; un atelier non terminé sera noté avec ce qui a été fait.","Oui",async()=>{
    /* plusieurs encadrants : seul le premier qui valide fait changer d'atelier, les autres sont prévenus (pas d'atelier sauté) */
    const cur=deroules[sid];if(!cur||cur.r!==d.r){toast("Un autre encadrant vient déjà de changer d'atelier");rendre();return}
    try{const L=await db.collection("config").doc("av-"+sid+"-"+d.r).acquire({holder:DEVICE,ttlMs:120000});if(!L.acquired){toast("Un autre encadrant vient déjà de changer d'atelier");return}
      const s2=await db.collection("deroule").doc(sid).get();const d2=s2&&s2.exists?s2.data():null;if(d2&&d2.r!==d.r){deroules[sid]=d2;toast("Un autre encadrant vient déjà de changer d'atelier");rendre();return}}catch(e){}
    const nd=rotSuivanteDoc(d.r+1);deroules[sid]=nd;ecrire("deroule",sid,nd,"set");rendre()},"","Annuler")});
/* ----- échange de place entre deux séances : seulement avec le code donné par un encadrant ----- */
function codeEchange(sid){let h=7;const t=sid+"|echange|"+PIN;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))%1000003;return String(1000+h%9000)}
function ouvrirEchange(){const sid=seanceSel,s=seances[sid];if(!s)return;
  const autres=Object.keys(seances).filter(x=>x!==sid).flatMap(x=>(seances[x].etudiants||[]).map(e=>({sid:x,e}))).sort((a,b)=>a.e.n.localeCompare(b.e.n,"fr"));
  const ici=[...s.etudiants].sort((a,b)=>a.n.localeCompare(b.n,"fr"));
  modale("Échange de place",`<p>Vous venez à cette séance à la place d'un autre étudiant ? C'est possible <b>seulement avec l'accord d'un encadrant</b> : allez le voir, il vous donnera un code.</p>
   <label class="field">Votre nom (inscrit dans une autre séance)<select id="echMoi" class="gros"><option value="">Choisir…</option>${autres.map(a=>`<option value="${a.sid}|${a.e.id}">${esc(a.e.n)} ${esc(a.e.p)} (${esc(seances[a.sid].nom.split(" · ")[0])})</option>`).join("")}</select></label>
   <label class="field">Vous prenez la place de<select id="echAvec" class="gros"><option value="">Personne (je m'ajoute simplement)</option>${ici.filter(e=>!groupesDe(sid).some(g=>(g.membres||[]).includes(e.id))).map(e=>`<option value="${e.id}">${esc(e.n)} ${esc(e.p)}</option>`).join("")}</select></label>
   <label class="field">Code donné par l'encadrant<input id="echCode" inputmode="numeric" maxlength="6" autocomplete="off"></label>`,"Valider l'échange",()=>{
    const v=($("#echMoi")||{}).value||"",avec=($("#echAvec")||{}).value||"",code=(($("#echCode")||{}).value||"").trim();
    if(!v){toast("Choisissez votre nom");return}
    if(code!==codeEchange(sid)){toast("Code incorrect : demandez le code à un encadrant");return}
    faireEchange(sid,v.split("|")[0],v.split("|")[1],avec)},"","Annuler")}
async function faireEchange(sid,sidAutre,eid,avec){
  if(avec&&groupesDe(sid).some(g=>(g.membres||[]).includes(avec))){toast("Cette personne est déjà présente dans un groupe : choisissez « personne » ou un absent");return}
  try{const a=JSON.parse(JSON.stringify(seances[sid])),b=JSON.parse(JSON.stringify(seances[sidAutre]));
    const moiEnt=b.etudiants.find(e=>e.id===eid);if(!moiEnt){toast("Nom introuvable");return}
    b.etudiants=b.etudiants.filter(e=>e.id!==eid);
    if(avec){const lui=a.etudiants.find(e=>e.id===avec);a.etudiants=a.etudiants.filter(e=>e.id!==avec);if(lui)b.etudiants.push(lui)}
    if(!a.etudiants.some(e=>e.id===eid))a.etudiants.push(moiEnt);
    const trace={t:Date.now(),eid,de:sidAutre,vers:sid,avec:avec||null};
    a.echanges=[...(a.echanges||[]),trace];b.echanges=[...(b.echanges||[]),trace];
    await db.collection("seances").doc(sid).update({etudiants:a.etudiants,echanges:a.echanges});
    await db.collection("seances").doc(sidAutre).update({etudiants:b.etudiants,echanges:b.echanges});
    seances[sid]=a;seances[sidAutre]=b;
    if(typeof envoyerFeuille==="function")envoyerFeuille("ECHANGE",[sid,eid,moiEnt.n+" "+moiEnt.p,"de "+sidAutre,avec?"à la place de "+avec:"ajout"]);
    moiE={sid,eid};LS.set("moiEtu",moiE);choixBande=null;majMonGid();vue="hub";rendre();window.scrollTo(0,0);toast("Échange enregistré : vous êtes inscrit à cette séance")}
  catch(e){toast("Échange impossible pour l'instant : réessayez")}}

/* ===== Google Sheets : contexte des signalements + notes par étudiant (lignes ETU) ===== */
function aidDeVue(){return {a1:"a1",a3:"a3",fam:"a3",a4:"a4",a5:"a5",a6:"a6",salle:"a2",decompte:"a2",m1:"a2",m2:"a2",attente:"a2",fin:"a2"}[vue]||""}
window.__signalVisible=function(){return monGid!=="TEST"&&(!!aidDeVue()||(vue==="hub"&&!!moiE))};
window.__contexteSignal=function(){const aid=aidDeVue(),c={atelier:aid||vue,etat:{vue}};
  const at=ATELIERS.find(a=>a.id===aid);if(at)c.atelierNom="Atelier "+at.n+(at.nom?" · "+at.nom:"");
  if(moiE){c.sid=moiE.sid;c.eid=moiE.eid;const s=seances[moiE.sid],e=s&&(s.etudiants||[]).find(x=>x.id===moiE.eid);if(e)c.nom=e.n+" "+e.p}
  let g=null;try{g=monGroupe()}catch(e){}
  if(g){c.groupe=g.nom||g.id;c.etat.gid=g.id;if(aid){try{const t=monEquipe(g,aid);if(t)c.equipe=t.id}catch(e){}}
    try{if(moiE)c.etat.notes=noteEtudiant(g,moiE.eid)}catch(e){}
    try{const docs={a1:a1docs,a4:a4docs,a6:a6docs}[aid];if(docs&&c.equipe&&docs[c.equipe])c.etat.doc=docs[c.equipe]}catch(e){}}
  try{if(duel)c.etat.duel={id:duel.id||null,moi:moi||null,scores}}catch(e){}
  return c};
function envoyerNotesFeuille(force){if(typeof envoyerFeuille!=="function"||!String(aboCle).startsWith("prof:"))return 0;
  const sid=profSeance,s=seances[sid];if(!s||!(s.etudiants||[]).length)return 0;const p=phaseSeance(sid);if(!force&&p.phase!=="rot"&&p.phase!=="fin")return 0;
  const memo=LS.get("memoFeuille_"+sid,{});let n=0;
  s.etudiants.forEach(e=>{const g=groupesDe(sid).find(x=>(x.membres||[]).includes(e.id));if(!g)return;let r;try{r=noteEtudiant(g,e.id)}catch(err){return}
    const v=["a1","a2","a3","a4","a5","a6"].map(a=>r.par[a]!=null?fr(r.par[a]):"");const fin=r.finale!=null?fr(r.finale):"";
    const cle=v.join(";")+";"+fin;if(!force&&memo[e.id]===cle)return;if(!force&&!v.some(x=>x!==""))return;
    memo[e.id]=cle;n++;envoyerFeuille("ETU",[sid,g.nom||g.id,e.id,(e.n||"")+" "+(e.p||""),...v,fin,p.phase])});
  LS.set("memoFeuille_"+sid,memo);return n}
setInterval(()=>{try{envoyerNotesFeuille(false)}catch(e){}},45000);
document.addEventListener("click",ev=>{const b=ev.target.closest&&ev.target.closest("#feuilleTout");if(!b)return;
  const n=envoyerNotesFeuille(true);toast(n?n+" ligne(s) envoyée(s) au tableur des notes":"Rien à envoyer pour l'instant (groupes pas encore formés ?)")});
</script>

<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
<script>window.__CONFIRM_SEL__="[data-q],[data-fdk]";
/* quiz : on choisit sa réponse, puis on la valide (évite les réponses données par erreur) */
(function(){var SEL=window.__CONFIRM_SEL__;if(!SEL)return;var choix=null,bar=null;
  function cle(b){var a=b.attributes,k=[];for(var i=0;i<a.length;i++)if(/^data-/.test(a[i].name))k.push(a[i].name+"="+a[i].value);return (k.length?k.join("&"):"t="+b.textContent.trim())+"|"+(b.closest("[id]")||{}).id}
  function trouver(){if(!choix)return null;var l=document.querySelectorAll(SEL);for(var i=0;i<l.length;i++)if(cle(l[i])===choix)return l[i];return null}
  function barre(){if(!bar){bar=document.createElement("div");bar.id="confirmBar";bar.style.cssText="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9500;display:none;gap:8px;align-items:center;background:#1d1f1c;color:#fff;padding:10px 12px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.3);font:600 16px system-ui,sans-serif";
    bar.innerHTML='<span style="padding:0 6px">Votre choix est fait ?</span><button type="button" id="confirmOk" style="background:#2f7a4a;color:#fff;border:0;border-radius:999px;padding:10px 18px;font:700 16px system-ui,sans-serif;cursor:pointer">Valider ma réponse</button><button type="button" id="confirmNon" style="background:transparent;color:#fff;border:1px solid #888;border-radius:999px;padding:9px 14px;font:600 15px system-ui,sans-serif;cursor:pointer">Changer</button>';
    document.body.appendChild(bar);
    bar.querySelector("#confirmOk").addEventListener("click",function(){var b=trouver();choix=null;sync();if(!b||b.disabled)return;var ev=new MouseEvent("click",{bubbles:true,cancelable:true});ev.__confirme=true;b.dispatchEvent(ev)});
    bar.querySelector("#confirmNon").addEventListener("click",function(){choix=null;sync()})}return bar}
  function sync(){var l=document.querySelectorAll(SEL),b=trouver();for(var i=0;i<l.length;i++){if(l[i]===b){l[i].style.outline="4px solid #2f7a4a";l[i].style.outlineOffset="2px";l[i].setAttribute("aria-pressed","true")}else if(l[i].style.outline){l[i].style.outline="";l[i].style.outlineOffset="";l[i].removeAttribute("aria-pressed")}}
    if(choix&&!b)choix=null;barre().style.display=choix?"flex":"none"}
  document.addEventListener("click",function(e){if(e.__confirme)return;var b=e.target.closest&&e.target.closest(SEL);if(!b||b.disabled)return;
    e.stopImmediatePropagation();e.preventDefault();choix=cle(b);sync()},true);
  setInterval(sync,300)})();

</script>
